<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LearnEngine</title>
<!-- API proxy URL: GH Pages calls Vercel; Vercel deploy uses same-origin.
     Update the content= value below to your Vercel deployment URL. -->
<meta name="learnengine-api-base" content="https://learnengine-eta.vercel.app">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🧠</text></svg>">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a25;--border:#2a2a3a;--text:#e0e0e8;--text-muted:#8888a0;--accent:#6366f1;--accent-glow:rgba(99,102,241,.15);--green:#22c55e;--red:#ef4444;--yellow:#eab308;--orange:#f97316;--cyan:#06b6d4;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:800px;margin:0 auto;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;margin-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.header h1 span{color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-muted);cursor:pointer;font-size:13px;transition:.2s;white-space:nowrap}
.nav button:hover,.nav button.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.nav .review-btn{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
.nav .settings-btn{font-size:16px;padding:8px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:14px;font-weight:600}
input[type=text],textarea{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px}
.input-group{margin-bottom:14px}
.btn{padding:12px 22px;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;transition:.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#5558e6}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-orange{background:var(--orange);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface2);border-radius:8px;padding:14px;border:1px solid var(--border);text-align:center}
.stat-card .value{font-size:26px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:12px;color:var(--text-muted);margin-top:2px}
.mastery-bar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--surface2);margin:8px 0}
.mastery-bar .seg{height:100%}
.seg-mastered{background:var(--green)}
.seg-learning{background:var(--yellow)}
.seg-struggling{background:var(--red)}
.question-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.q-num{font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.q-text{font-size:15px;font-weight:500;margin-bottom:14px;line-height:1.5}
.option{display:block;width:100%;text-align:left;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;margin-bottom:7px;font-size:14px;transition:.15s;font-family:inherit}
.option:hover{border-color:var(--accent);background:var(--accent-glow)}
.option.selected{border-color:var(--accent);background:var(--accent-glow)}
.option.correct{border-color:var(--green);background:rgba(34,197,94,.1)}
.option.incorrect{border-color:var(--red);background:rgba(239,68,68,.1)}
.badge{display:inline-block;background:var(--surface);color:var(--text-muted);padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;margin-right:7px}
.progress-bar{height:5px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--accent);transition:width .3s}
.score-display{text-align:center;padding:32px}
.score-big{font-size:62px;font-weight:800}
.score-big.great{color:var(--green)}
.score-big.okay{color:var(--yellow)}
.score-big.needs-work{color:var(--orange)}
.score-big.struggling{color:var(--red)}
.explanation{background:var(--bg);border-left:3px solid var(--accent);padding:11px 14px;border-radius:6px;margin-top:12px;font-size:14px}
.deeper{background:rgba(6,182,212,.06);border-left:3px solid var(--cyan);padding:8px 12px;border-radius:6px;margin-top:10px;font-size:13px;color:var(--text-muted)}
.misconception{background:rgba(249,115,22,.06);border-left:3px solid var(--orange);padding:8px 12px;border-radius:6px;margin-top:10px;font-size:13px;color:var(--text-muted)}
.hint-box{background:rgba(99,102,241,.06);border:1px dashed var(--accent);padding:9px 12px;border-radius:6px;margin-top:9px;font-size:13px;color:var(--accent);cursor:pointer}
.teaching-banner{background:rgba(249,115,22,.08);border:1px solid var(--orange);padding:11px 14px;border-radius:var(--radius);margin-bottom:14px;font-size:14px;color:var(--text)}
.video-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.video-item:last-child{border-bottom:none}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.topic-pill{display:inline-block;padding:3px 9px;border-radius:11px;font-size:12px;margin:2px}
.topic-strong{background:rgba(34,197,94,.15);color:var(--green)}
.topic-weak{background:rgba(239,68,68,.15);color:var(--red)}
.fact-item{padding:9px 11px;border-radius:6px;margin-bottom:5px;font-size:13px;border:1px solid var(--border)}
.fact-accurate{border-left:3px solid var(--green)}
.fact-inaccurate{border-left:3px solid var(--red)}
.fact-partially_accurate,.fact-unverifiable{border-left:3px solid var(--yellow)}
.fact-badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;margin-right:6px}
.hidden{display:none}
.key-status{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.key-ok{background:var(--green)}
.key-missing{background:var(--red)}
.proxy-banner{background:rgba(99,102,241,.08);border:1px solid var(--accent);padding:9px 12px;border-radius:8px;margin-bottom:14px;font-size:12px;color:var(--text-muted)}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
// ============ Config ============
// API base: GH Pages reads from <meta>; Vercel deploy uses same-origin.
function getApiBase(){
  if(location.hostname==='mikedmote52.github.io'){
    const m=document.querySelector('meta[name="learnengine-api-base"]');
    return (m&&m.content)?m.content.replace(/\/$/,''):'';
  }
  // Same-origin (Vercel deployment, or local dev with proxy)
  return '';
}
const API_BASE=getApiBase();

// ============ Cold-start warmup (fire-and-forget) ============
// Hits /api/health the moment the script parses so the Vercel function is
// already warm by the time the user submits a video.
try{fetch(API_BASE+'/api/health',{method:'GET',cache:'no-store'}).catch(()=>{})}catch(e){}

// ============ HTML escape ============
function E(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// ============ IndexedDB ============
const DB_NAME='LearnEngineDB';const DB_VER=4;
let idb=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('profile'))db.createObjectStore('profile',{keyPath:'id'});
      if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos',{keyPath:'video_id'});
      if(!db.objectStoreNames.contains('quizzes'))db.createObjectStore('quizzes',{keyPath:'id'});
      if(!db.objectStoreNames.contains('history'))db.createObjectStore('history',{keyPath:'id',autoIncrement:true});
      if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'id'});
      // v4: embeddings store for similarity-based spaced repetition
      if(!db.objectStoreNames.contains('embeddings'))db.createObjectStore('embeddings',{keyPath:'concept_id'});
    };
    req.onsuccess=e=>{idb=e.target.result;resolve(idb)};
    req.onerror=e=>reject(e);
  });
}
function dbGet(store,key){return new Promise((res,rej)=>{const tx=idb.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=idb.transaction(store,'readwrite');const r=tx.objectStore(store).put(val);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=idb.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=rej})}

async function getProfile(){
  let p=await dbGet('profile','main');
  if(!p)p={id:'main',totalQuizzes:0,totalQuestions:0,accuracy:0,topics:{},concepts:{},weakAreas:[],strongAreas:[],learningStyle:{}};
  return p;
}

// ============ SM-2 ============
function sm2Update(concept,quality){
  if(!concept.easiness){concept.easiness=2.5;concept.interval=1;concept.reps=0}
  if(quality>=3){
    if(concept.reps===0)concept.interval=1;
    else if(concept.reps===1)concept.interval=6;
    else concept.interval=Math.round(concept.interval*concept.easiness);
    concept.reps++;
  }else{concept.reps=0;concept.interval=1}
  concept.easiness=Math.max(1.3,concept.easiness+0.1-(5-quality)*(0.08+(5-quality)*0.02));
  concept.lastReview=new Date().toISOString();
  concept.nextReview=new Date(Date.now()+concept.interval*86400000).toISOString();
  concept.tested=(concept.tested||0)+1;
  concept.correct=(concept.correct||0)+(quality>=3?1:0);
  concept.mastery=concept.correct/concept.tested;
  return concept;
}

function getDueConcepts(profile){
  const now=Date.now();const due=[];
  for(const[id,c]of Object.entries(profile.concepts||{})){
    if(!c.nextReview||new Date(c.nextReview).getTime()<=now)due.push({id,...c});
  }
  due.sort((a,b)=>new Date(a.nextReview||0).getTime()-new Date(b.nextReview||0).getTime());
  return due;
}

// ============ Embeddings + cosine similarity ============
// Used to pick the most-similar prior concept when scheduling review variations,
// avoiding the "ask the LLM if these are similar" anti-pattern.
function cosineSim(a,b){
  let dot=0,na=0,nb=0;
  for(let i=0;i<a.length;i++){dot+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i]}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)+1e-9);
}

async function ensureEmbeddings(conceptIds,profile){
  // Fetch embeddings for any concepts that don't have one yet (batched).
  const missing=[];const inputs=[];
  for(const cid of conceptIds){
    const cached=await dbGet('embeddings',cid);
    if(cached)continue;
    const c=profile.concepts[cid];if(!c)continue;
    missing.push(cid);
    inputs.push((c.name||cid)+': '+(c.description||''));
  }
  if(!missing.length)return;
  try{
    const res=await fetch(API_BASE+'/api/embed',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inputs})});
    if(!res.ok)return;
    const j=await res.json();
    for(let i=0;i<missing.length;i++){
      await dbPut('embeddings',{concept_id:missing[i],vector:j.embeddings[i],created_at:new Date().toISOString()});
    }
  }catch(e){/* embeddings are optional; spaced repetition still works without */}
}

async function similarConcepts(targetId,topK=5){
  const target=await dbGet('embeddings',targetId);
  if(!target)return[];
  const all=await dbGetAll('embeddings');
  return all
    .filter(e=>e.concept_id!==targetId)
    .map(e=>({concept_id:e.concept_id,score:cosineSim(target.vector,e.vector)}))
    .sort((a,b)=>b.score-a.score)
    .slice(0,topK);
}

// ============ Result recording ============
async function recordResult(quizId,answers,questions){
  if(!questions||!questions.length)return{score:0,correct:0,total:0,details:[],wrongAnswers:[],weakAreas:[],strongAreas:[],needsFollowup:false,learningStyle:{},dueForReview:0};
  const profile=await getProfile();
  let correct=0;const details=[];const wrong=[];
  questions.forEach((q,i)=>{
    const sel=answers[i];
    const opts=(q.options||[]).map((o,idx)=>({...o,label:o.label||String.fromCharCode(65+idx)}));
    const rightOpt=opts.find(o=>o.correct);
    const selOpt=opts.find(o=>o.label===sel);
    const isCorrect=sel===rightOpt?.label;
    if(isCorrect)correct++;
    else wrong.push({question:q.question,selected:sel,selectedText:selOpt?.text||'',correct:rightOpt?.label,correctText:rightOpt?.text||'',whyWrong:selOpt?.why_wrong||'',explanation:q.explanation||'',concept_id:q.concept_id,concept_name:q.concept_name,topic:q.topic});
    details.push({question:q.question,correct:isCorrect,selected:sel,selectedText:selOpt?.text||'',correctAnswer:rightOpt?.label,correctText:rightOpt?.text||'',whyWrong:(!isCorrect&&selOpt)?selOpt.why_wrong||'':'',explanation:q.explanation||'',deeperInsight:q.deeper_insight||'',misconception:q.common_misconception||'',concept_id:q.concept_id,concept_name:q.concept_name||'',topic:q.topic||'',bloom:q.bloom_level||''});
    const cid=q.concept_id||(q.concept_name?q.concept_name.toLowerCase().replace(/\s+/g,'_'):'q_'+i);
    const quality=isCorrect?4:1;
    if(!profile.concepts[cid])profile.concepts[cid]={topic:q.topic||'general',name:q.concept_name||cid,description:q.question.slice(0,200)};
    profile.concepts[cid]=sm2Update(profile.concepts[cid],quality);
  });

  const total=questions.length;const score=total>0?correct/total:0;
  profile.totalQuizzes++;profile.totalQuestions+=total;
  const oldTotal=profile.totalQuestions-total;
  const oldCorrect=Math.round(profile.accuracy*oldTotal);
  profile.accuracy=profile.totalQuestions>0?(oldCorrect+correct)/profile.totalQuestions:0;

  const topicScores={};
  details.forEach(d=>{const t=d.topic||'general';if(!topicScores[t])topicScores[t]={c:0,t:0};topicScores[t].t++;if(d.correct)topicScores[t].c++});
  for(const[topic,s]of Object.entries(topicScores)){
    if(!profile.topics[topic])profile.topics[topic]={strength:.5,count:0};
    const t=profile.topics[topic];
    t.strength=.7*t.strength+.3*(s.c/s.t);t.count+=s.t;t.lastSeen=new Date().toISOString();
  }
  const minCount=profile.totalQuizzes<=1?1:2;
  profile.weakAreas=Object.entries(profile.topics).filter(([,d])=>d.strength<.6&&d.count>=minCount).map(([t])=>t);
  profile.strongAreas=Object.entries(profile.topics).filter(([,d])=>d.strength>=.85&&d.count>=minCount).map(([t])=>t);

  const wrongTopics=details.filter(d=>!d.correct).map(d=>d.topic);
  const ls=profile.learningStyle||{};
  ls.recentStruggles=[...new Set(wrongTopics)];
  if(total>=3){ls.teachingMode=score<.4?'foundational':score<.7?'scaffolded':'challenging'}
  profile.learningStyle=ls;

  await dbPut('profile',profile);
  await dbPut('history',{id:Date.now(),quizId,timestamp:new Date().toISOString(),score,total,correct});

  // Fire-and-forget: compute embeddings for the concepts touched (used for review variation)
  const touched=questions.map(q=>q.concept_id||(q.concept_name?q.concept_name.toLowerCase().replace(/\s+/g,'_'):'')).filter(Boolean);
  ensureEmbeddings(touched,profile).catch(()=>{});

  return{score:Math.round(score*100*10)/10,correct,total,details,wrongAnswers:wrong,weakAreas:profile.weakAreas,strongAreas:profile.strongAreas,needsFollowup:score<.85,learningStyle:profile.learningStyle,dueForReview:getDueConcepts(profile).length};
}

// ============ Transcript fetch (no key needed) ============
function extractVideoId(url){
  const patterns=[/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,/(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,/^([a-zA-Z0-9_-]{11})$/];
  for(const p of patterns){const m=url.match(p);if(m)return m[1]}
  throw new Error('Could not find a YouTube video ID in that URL');
}

async function fetchTranscript(videoId){
  // 1) Local Mac proxy (fastest, no rate limits)
  try{
    const r=await fetch('http://localhost:8219/transcript?v='+videoId,{signal:AbortSignal.timeout(5000)});
    if(r.ok){const j=await r.json();if(j.full_text)return j.full_text}
  }catch(e){}

  // 2) Vercel proxy /api/transcript (server-side youtube_transcript_api)
  try{
    const r=await fetch(API_BASE+'/api/transcript',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:'https://youtube.com/watch?v='+videoId}),signal:AbortSignal.timeout(20000)});
    if(r.ok){const j=await r.json();if(j.full_text)return j.full_text}
  }catch(e){}

  throw new Error('Could not fetch transcript automatically. Open the "Paste transcript manually" section below, go to the YouTube video, click "..." > "Show transcript", copy and paste here.');
}

// ============ Proxy API (key stays server-side) ============
async function api(path,body,timeoutMs=240000){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),timeoutMs);
  try{
    const res=await fetch(API_BASE+path,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body||{}),
      signal:ctl.signal,
    });
    clearTimeout(timer);
    let data=null;
    try{data=await res.json()}catch(e){}
    if(!res.ok){
      const msg=data?.error||('API '+res.status);
      throw new Error(msg);
    }
    return data;
  }catch(e){
    clearTimeout(timer);
    if(e.name==='AbortError')throw new Error('Request timed out. The proxy may be cold-starting; try again.');
    throw e;
  }
}

// ============ State ============
let S={view:'dashboard',videos:[],quizzes:[],currentQuiz:null,answers:{},results:null,processing:false,hints:{},profile:null,dueCount:0,serverOk:false,proxyUrl:''};

// ============ Init ============
async function init(){
  await openDB();
  S.profile=await getProfile();
  S.videos=await dbGetAll('videos');
  S.quizzes=await dbGetAll('quizzes');
  S.dueCount=getDueConcepts(S.profile).length;
  S.proxyUrl=API_BASE||location.origin;
  // Health check is fire-and-forget so cold-start latency never blocks render.
  S.serverOk=false;
  fetch(API_BASE+'/api/health',{cache:'no-store'}).then(r=>r.json()).then(h=>{
    S.serverOk=!!h?.has_api_key;S.modelInfo=h?.models||null;
    try{render()}catch(e){}
  }).catch(()=>{});
  render();
}

// ============ Render ============
function render(){
  document.getElementById('app').innerHTML=renderHeader()+(
    S.view==='dashboard'?renderDashboard():
    S.view==='process'?renderProcess():
    S.view==='quiz'?renderQuiz():
    S.view==='results'?renderResults():
    S.view==='history'?renderHistory():
    S.view==='settings'?renderSettings():''
  );
}

function renderHeader(){
  return`<div class="header"><h1><span>Learn</span>Engine</h1><div class="nav">
    <button class="${S.view==='dashboard'?'active':''}" onclick="nav('dashboard')">Dashboard</button>
    <button class="${S.view==='process'?'active':''}" onclick="nav('process')">+ New Video</button>
    <button class="${S.view==='history'?'active':''}" onclick="nav('history')">History</button>
    ${S.dueCount>0?`<button class="review-btn" onclick="startReview()">Review (${S.dueCount})</button>`:''}
    <button class="settings-btn ${S.view==='settings'?'active':''}" onclick="nav('settings')"><span class="key-status ${S.serverOk?'key-ok':'key-missing'}"></span>Settings</button></div></div>`;
}

function renderDashboard(){
  const p=S.profile||{};const acc=Math.round((p.accuracy||0)*100*10)/10;
  const concepts=Object.values(p.concepts||{});
  const mastered=concepts.filter(c=>(c.mastery||0)>=.85).length;
  const learning=concepts.filter(c=>(c.mastery||0)>=.5&&(c.mastery||0)<.85).length;
  const struggling=concepts.filter(c=>(c.mastery||0)<.5).length;
  const total=mastered+learning+struggling;
  const mp=total?mastered/total*100:0,lp=total?learning/total*100:0,sp=total?struggling/total*100:0;

  let html=`<div class="stats-grid">
    <div class="stat-card"><div class="value">${S.videos.length}</div><div class="label">Videos</div></div>
    <div class="stat-card"><div class="value">${p.totalQuizzes||0}</div><div class="label">Quizzes</div></div>
    <div class="stat-card"><div class="value">${acc}%</div><div class="label">Accuracy</div></div>
    <div class="stat-card"><div class="value" style="color:${S.dueCount?'var(--orange)':'var(--green)'}">${S.dueCount}</div><div class="label">Due Review</div></div>
  </div>`;

  if(total>0)html+=`<div class="card"><h2>Concept Mastery</h2>
    <div class="mastery-bar"><div class="seg seg-mastered" style="width:${mp}%"></div><div class="seg seg-learning" style="width:${lp}%"></div><div class="seg seg-struggling" style="width:${sp}%"></div></div>

async function resetAllData(){
  const stores=['profile','videos','quizzes','history','embeddings'];
  for(const s of stores){
    try{await new Promise((res,rej)=>{const tx=idb.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=res;tx.onerror=rej})}catch(e){}
  }
  S={view:'dashboard',videos:[],quizzes:[],currentQuiz:null,answers:{},results:null,processing:false,hints:{},profile:null,dueCount:0,serverOk:S.serverOk,proxyUrl:S.proxyUrl,modelInfo:S.modelInfo};
  await init();
}

function setStatus(msg){const el=document.getElementById('processStatus');if(el)el.textContent=msg}
function setError(msg){const el=document.getElementById('processErr');if(el)el.textContent=msg}
// Live elapsed counter for long-running analyses.
function startElapsedCounter(prefix){
  const start=Date.now();let stopped=false;
  const tick=()=>{if(stopped)return;const s=Math.floor((Date.now()-start)/1000);setStatus(prefix+' '+s+'s')};
  tick();const id=setInterval(tick,1000);
  return ()=>{stopped=true;clearInterval(id)};
}

async function processVideo(){
  const url=document.getElementById('vidUrl')?.value?.trim();
  const title=document.getElementById('vidTitle')?.value?.trim();
  const manual=document.getElementById('manualTx')?.value?.trim();
  if(!url&&!manual){setError('Enter a YouTube URL or paste a transcript');return}

  S.processing=true;render();

  try{
    let transcript='',videoId,analysis;
    const profile=await getProfile();
    const learnerCtx={
      learning_style:profile.learningStyle||{},
      weak_areas:profile.weakAreas||[],
      strong_areas:profile.strongAreas||[],
      overall_accuracy:Math.round((profile.accuracy||.5)*100),
    };

    if(manual){
      // Pasted-transcript path (kept as the safety net).
      transcript=manual;videoId=url?extractVideoId(url):'manual_'+Date.now().toString(36);
      setStatus('Using pasted transcript...');
      if(!transcript||transcript.length<50){S.processing=false;render();setError('Transcript too short (need at least 50 characters)');return}
      setStatus('Analyzing via proxy (Sonnet, 30-60s)...');
      analysis=await api('/api/analyze',{transcript,title:title||'Video',learner_context:learnerCtx});
    }else{
      // YouTube URL path — Gemini watches the video directly via Google's
      // infrastructure (sidesteps the YouTube IP block on Vercel egress).
      videoId=extractVideoId(url);
      let stopCounter=startElapsedCounter('Asking Gemini to watch the video... (typically 45-75s) ·');
      // Auto-retry once on first failure: cold-start aborts and transient
      // 5xx usually succeed on a second attempt against a now-warm function.
      let attempt=0,lastErr=null;
      while(attempt<2){
        attempt++;
        try{
          analysis=await api('/api/analyze-youtube',{
            youtube_url:url,
            options:{title:title||'',learner_context:learnerCtx},
          },240000);
          lastErr=null;break;
        }catch(e){
          lastErr=e;
          if(attempt>=2)break;
          stopCounter&&stopCounter();
          stopCounter=startElapsedCounter('First try hiccuped — retrying on a warm function... ·');
        }
      }
      stopCounter&&stopCounter();
      if(lastErr){
        S.processing=false;render();
        setError('Video analysis failed: '+lastErr.message+'. As a fallback, expand "Paste transcript manually" below and paste the transcript yourself.');
        return;
      }
      // Build a synthetic transcript blob from the analysis so the followup
      // and review flows (which expect a stored transcript) keep working.
      const concepts=(analysis.key_concepts||analysis.concepts||[]).map(c=>c.name+': '+(c.explanation||'')).join('\n');
      const objectives=(analysis.learning_objectives||[]).join('\n');
      transcript=[analysis.summary||'',objectives,concepts].filter(Boolean).join('\n\n');
    }

    if(analysis.error)throw new Error(analysis.error);

    if(analysis.quiz&&analysis.quiz.length){
      analysis.quiz=analysis.quiz.filter(q=>{
        if(!q.question||!q.options||!q.options.length)return false;
        const correctCount=q.options.filter(o=>o.correct).length;
        if(correctCount===0)return false;
        if(correctCount>1){let found=false;q.options.forEach(o=>{if(o.correct&&found)o.correct=false;if(o.correct)found=true})}
        q.options.forEach((o,idx)=>{if(!o.label)o.label=String.fromCharCode(65+idx)});
        return true;
      });
    }

    const videoData={video_id:videoId,url:url||'manual',title:title||'Video '+videoId,transcript:{full_text:transcript.slice(0,50000),word_count:transcript.split(/\s+/).length},analysis,processed_at:new Date().toISOString()};
    await dbPut('videos',videoData);

    if(analysis.quiz?.length){
      const quiz={id:Date.now().toString(36),video_id:videoId,video_title:title||'Video '+videoId,quiz_type:'initial',questions:analysis.quiz,created_at:new Date().toISOString()};
      await dbPut('quizzes',quiz);
      S.currentQuiz=quiz;S.answers={};S.hints={};
      S.videos=await dbGetAll('videos');S.quizzes=await dbGetAll('quizzes');
      S.processing=false;S.view='quiz';render();window.scrollTo(0,0);
    }else{
      S.processing=false;render();
      setError('Analysis completed but no valid quiz questions were generated. Try again or use a different video.');
    }
  }catch(e){
    S.processing=false;render();
    setError(e.message);
  }
}

async function submitQuiz(){
  const q=S.currentQuiz;if(!q||!q.questions?.length)return;
  S.results=null;
  try{
    S.results=await recordResult(q.id,S.answers,q.questions);
    S.profile=await getProfile();S.dueCount=getDueConcepts(S.profile).length;
    S.view='results';render();window.scrollTo(0,0);
  }catch(e){alert('Error scoring quiz: '+e.message)}
}

async function requestFollowup(){
  const q=S.currentQuiz;const r=S.results;if(!q||!r)return;
  S.processing=true;render();
  try{
    const profile=await getProfile();
    const video=await dbGet('videos',q.video_id);
    const transcript=video?.transcript?.full_text||'';
    const weakConceptIds=[...new Set(r.wrongAnswers.map(w=>w.concept_id).filter(Boolean))];
    // Build extra context the server can use to ground the teaching sequence in
    // the original quiz: pass missed question indices + the original quiz so the
    // follow-up can reason against what the learner actually saw.
    const originalQuiz=q.questions||[];
    const missedIdx=originalQuiz.map((qq,i)=>({qq,i,a:S.answers?.[i]})).filter(x=>{
      const correctOpt=(x.qq.options||[]).find(o=>o.correct);
      return !x.a||x.a!==correctOpt?.label;
    }).map(x=>x.i);
    const result=await api('/api/followup',{
      wrong_answers:r.wrongAnswers,
      weak_concepts:weakConceptIds,
      transcript,
      missed_question_indices:missedIdx,
      original_quiz:originalQuiz,
      areas_to_strengthen:r.weakAreas||[],
      learner_context:{learning_style:profile.learningStyle||{},weak_areas:profile.weakAreas||[],overall_accuracy:Math.round((profile.accuracy||.5)*100)}
    },240000);
    if(result.error)throw new Error(result.error);
    if(!result.quiz||!result.quiz.length)throw new Error('Follow-up generated no questions. Try again.');
    const followup={id:Date.now().toString(36),video_id:q.video_id,video_title:q.video_title,quiz_type:'followup',questions:result.quiz,focus_areas:result.focus_areas||[],diagnosis:result.diagnosis||'',teaching_strategy:result.teaching_strategy||'',created_at:new Date().toISOString()};
    await dbPut('quizzes',followup);
    S.quizzes=await dbGetAll('quizzes');
    S.currentQuiz=followup;S.answers={};S.hints={};S.results=null;S.processing=false;S.view='quiz';render();window.scrollTo(0,0);
  }catch(e){S.processing=false;S.view='results';render();alert('Follow-up error: '+e.message)}
}

async function startReview(){
  S.processing=true;render();
  try{
    const profile=await getProfile();
    let dueRaw=getDueConcepts(profile);
    if(!dueRaw.length){S.processing=false;render();alert('No concepts due for review right now.');return}

    // Embeddings-aware ordering: pull the lowest-mastery seed, then expand to top-similar
    // concepts so the review pack tests related ideas, not random ones.
    await ensureEmbeddings(dueRaw.map(c=>c.id),profile).catch(()=>{});
    const seed=dueRaw.slice().sort((a,b)=>(a.mastery||0)-(b.mastery||0))[0];
    let ordered=dueRaw;
    if(seed){
      const sims=await similarConcepts(seed.id,15).catch(()=>[]);
      const simMap=Object.fromEntries(sims.map(s=>[s.concept_id,s.score]));
      ordered=dueRaw.slice().sort((a,b)=>{
        if(a.id===seed.id)return -1;if(b.id===seed.id)return 1;
        return (simMap[b.id]||0)-(simMap[a.id]||0);
      });
    }
    const due=ordered.slice(0,15).map(c=>({id:c.id,name:c.name,topic:c.topic,mastery:Math.round((c.mastery||0)*100)+'%',tested:c.tested}));

    const result=await api('/api/review',{due_concepts:due});
    if(result.error)throw new Error(result.error);
    if(!result.quiz||!result.quiz.length){S.processing=false;render();alert('Review generated no questions. Try again.');return}
    const review={id:Date.now().toString(36),video_id:'review',video_title:'Spaced Review',quiz_type:'review',questions:result.quiz,focus_areas:result.focus_areas||[],created_at:new Date().toISOString()};
    await dbPut('quizzes',review);
    S.quizzes=await dbGetAll('quizzes');
    S.currentQuiz=review;S.answers={};S.hints={};S.results=null;S.processing=false;S.view='quiz';render();window.scrollTo(0,0);
  }catch(e){S.processing=false;render();alert('Review error: '+e.message)}
}

function loadQuiz(videoId){
  const q=S.quizzes.find(q=>q.video_id===videoId&&q.quiz_type!=='followup'&&q.quiz_type!=='review');
  if(q){S.currentQuiz=q;S.answers={};S.hints={};S.view='quiz';render();window.scrollTo(0,0)}
}
function startQuizById(id){
  const q=S.quizzes.find(q=>q.id===id);
  if(q){S.currentQuiz=q;S.answers={};S.hints={};S.view='quiz';render();window.scrollTo(0,0)}
}

// Boot
init();
</script>
