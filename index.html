function setProcStatus(t) { const el = document.getElementById('processStatus'); if (el) el.textContent = t || ''; }
function setProcErr(t)    { const el = document.getElementById('processErr'); if (el) { el.style.color = 'var(--danger)'; el.textContent = t || ''; } }

function refreshSrcMeta(kind) {
  // Best-effort detection; oEmbed lookups are out-of-band for v2 because they
  // add a third-party round-trip and aren't critical to add-to-library flow.
  const v = (document.getElementById('srcUrl')?.value || '').trim();
  const m = document.getElementById('srcMeta');
  if (!m) return;
  if (!v) { m.textContent = ''; return; }
  if (kind === 'youtube') {
    const id = (v.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/) || v.match(/^([a-zA-Z0-9_-]{11})$/) || [])[1];
    m.textContent = id ? ('Detected video id: ' + id) : 'URL not recognized as YouTube';
  } else {
    if (/spotify\.com/i.test(v)) m.textContent = 'Spotify link detected — will resolve via PodcastIndex';
    else if (/podcasts\.apple\.com/i.test(v)) m.textContent = 'Apple Podcasts link detected';
    else if (/\.mp3|\.m4a|\.wav/i.test(v)) m.textContent = 'Direct audio link detected';
    else if (/\.xml|\/rss|\/feed/i.test(v) || /<rss/i.test(v)) m.textContent = 'RSS feed link detected';
    else m.textContent = 'Will attempt to resolve via PodcastIndex';
  }
}

function extractVideoId(url) {
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  throw new Error('Could not find a YouTube video ID in that URL');
}

/* Live status counter for long-running analyses. Returns a stop function. */
function startElapsedCounter(prefix) {
  const start = Date.now();
  let stopped = false;
  const tick = () => {
    if (stopped) return;
    const s = Math.floor((Date.now() - start) / 1000);
    setProcStatus(prefix + ' ' + s + 's');
  };
  tick();
  const id = setInterval(tick, 1000);
  return () => { stopped = true; clearInterval(id); };
}

async function processYoutube() {
  const url = (document.getElementById('srcUrl')?.value || '').trim();
  const manual = (document.getElementById('manualTx')?.value || '').trim();
  if (!url && !manual) { setProcErr('Enter a YouTube URL or paste a transcript'); return; }
  S.processing = true; render();
  let stopCounter = null;
  try {
    const profile = await getProfile();
    const learnerCtx = { learning_style: {}, weak_areas: [], strong_areas: [], overall_accuracy: 50 };
    let analysis, sourceId, transcript = '', title = '';
    const requestedCount = S.questionCount || 15;
    if (manual) {
      sourceId = url ? ('yt_' + extractVideoId(url)) : ('manual_' + Date.now().toString(36));
      setProcStatus('Analyzing pasted transcript…');
      analysis = await api('/api/analyze', { transcript: manual, title: title || 'Video', learner_context: learnerCtx });
      transcript = manual;
    } else {
      const vid = extractVideoId(url);
      sourceId = 'yt_' + vid;
      // Tailor the elapsed-time hint to the chosen depth so a 100-question wait
      // doesn't feel like the proxy is stuck.
      const expected = requestedCount >= 100 ? '~120–150s'
                     : requestedCount >= 50  ? '~70–100s'
                     : requestedCount >= 30  ? '~50–70s'
                     : '~45–75s';
      stopCounter = startElapsedCounter('Asking Gemini to watch the video… (typically ' + expected + ') ·');
      // Auto-retry once on first failure: cold-start aborts and transient
      // 5xx usually succeed on a second attempt against a now-warm function.
      let attempt = 0, lastErr = null;
      while (attempt < 2) {
        attempt++;
        try {
          analysis = await api('/api/analyze-youtube', {
            youtube_url: url,
            question_count: requestedCount,
            options: { learner_context: learnerCtx },
          }, 240000);
          lastErr = null;
          break;
        } catch (e) {
          lastErr = e;
          if (attempt >= 2) break;
          stopCounter && stopCounter();
          stopCounter = startElapsedCounter('First try hiccuped — retrying on a warm function… ·');
        }
      }
      if (lastErr) throw lastErr;
      stopCounter && stopCounter(); stopCounter = null;
      title = analysis.title || ('Video ' + vid);
      const concepts = (analysis.key_concepts || analysis.concepts || []).map(c => c.name + ': ' + (c.explanation || '')).join('\n');
      transcript = [analysis.summary || '', (analysis.learning_objectives || []).join('\n'), concepts].filter(Boolean).join('\n\n');
    }
    S.lastProcessingSeconds = (typeof analysis.processing_seconds === 'number') ? analysis.processing_seconds : null;
    if (analysis.error) throw new Error(analysis.error);
    sanitizeQuiz(analysis);
    const sourceRec = { source_id: sourceId, type: 'youtube', url: url || null, title: title || analysis.title || 'Video', analysis, transcript, processed_at: nowISO() };
    await dbPut('sources', sourceRec);
    if (!analysis.quiz?.length) throw new Error('Analysis returned no usable quiz questions.');
    const quiz = { id: uid(), source_id: sourceId, source_title: sourceRec.title, source_type: 'youtube', quiz_type: 'initial', questions: analysis.quiz, created_at: nowISO() };
    await dbPut('quizzes', quiz);
    S.sources = await dbGetAll('sources');
    S.quizzes = await dbGetAll('quizzes');
    S.currentSource = sourceRec;
    S.currentQuiz = quiz;
    S.answers = {}; S.hints = {}; S.processing = false; S.results = null; S.promotedQuestionIdx = {};
    go('quiz');
  } catch (e) {
    if (stopCounter) { try { stopCounter(); } catch (_) {} }
    S.processing = false; render(); setProcErr(e.message);
  }
}

async function processPodcast() {
  const url = (document.getElementById('srcUrl')?.value || '').trim();
  if (!url) { setProcErr('Paste a podcast URL'); return; }
  S.processing = true; render();
  try {
    setProcStatus('Resolving podcast feed…');
    const profile = await getProfile();
    const learnerCtx = { learning_style: {}, weak_areas: [], strong_areas: [], overall_accuracy: 50 };
    const requestedCount = S.questionCount || 15;
    const result = await api('/api/analyze-podcast', {
      url,
      question_count: requestedCount,
      options: { learner_context: learnerCtx },
    }, 240000);
    if (result.error) {
      const err = new Error(result.message || result.error);
      err.payload = result;
      throw err;
    }
    sanitizeQuiz(result);
    S.lastProcessingSeconds = (typeof result.processing_seconds === 'number') ? result.processing_seconds : null;
    const sourceId = 'pod_' + (result.episode_id || uid());
    const title = result.title || result.episode_title || 'Podcast episode';
    const sourceRec = { source_id: sourceId, type: 'podcast', url, title, analysis: result, transcript: result.summary || '', processed_at: nowISO() };
    await dbPut('sources', sourceRec);
    if (!result.quiz?.length) throw new Error('Podcast analysis returned no usable quiz questions.');
    const quiz = { id: uid(), source_id: sourceId, source_title: title, source_type: 'podcast', quiz_type: 'initial', questions: result.quiz, created_at: nowISO() };
    await dbPut('quizzes', quiz);
    S.sources = await dbGetAll('sources');
    S.quizzes = await dbGetAll('quizzes');
    S.currentSource = sourceRec;
    S.currentQuiz = quiz;
    S.answers = {}; S.hints = {}; S.processing = false; S.results = null; S.promotedQuestionIdx = {};
    go('quiz');
  } catch (e) {
    S.processing = false; render();
    const code = e?.payload?.error || '';
    if (code === 'spotify_exclusive' || code === 'podcast_not_resolvable') {
      // Friendly, non-alarming render — this is "we can't, here's why" not "something blew up"
      renderPodcastSoftNotice(e.payload);
    } else {
      setProcErr(e.message || 'Podcast analysis failed');
    }
  }
}

function renderPodcastSoftNotice(payload) {
  const errEl = document.getElementById('processErr');
  if (!errEl) return;
  const msg = payload?.message
    || (payload?.error === 'spotify_exclusive'
        ? "This episode is Spotify-exclusive and can't be analyzed. Try a podcast with an RSS feed (Apple Podcasts, RSS link, or direct MP3)."
        : "We couldn't resolve that podcast. Try the Apple Podcasts URL or a public RSS feed link.");
  // Use the muted/info color, not danger red — this is informational, not a crash
  errEl.style.color = 'var(--text-secondary, #a8a29e)';
  errEl.textContent = msg;
}

function sanitizeQuiz(analysis) {
  if (!Array.isArray(analysis.quiz)) return;
  analysis.quiz = analysis.quiz.filter(q => {
    if (!q.question || !q.options || !q.options.length) return false;
    let foundCorrect = false;
    q.options.forEach(o => { if (o.correct) { if (foundCorrect) o.correct = false; else foundCorrect = true; } });
    if (!foundCorrect) return false;
    q.options.forEach((o, idx) => { if (!o.label) o.label = String.fromCharCode(65 + idx); });
    return true;
  });
}

/* --- Book chapter capture --- */

async function startBookCam() {
  if (!navigator.mediaDevices?.getUserMedia) {
    // Fallback to file picker on browsers without camera support
    return openBookFilePicker();
  }
  S.bookCapture = { pages: [], chapterTitle: '', stream: null };
  go('bookcam');
  // Start stream after render
  setTimeout(async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 } },
        audio: false,
      });
      S.bookCapture.stream = stream;
      const v = document.getElementById('camVideo');
      if (v) { v.srcObject = stream; await v.play().catch(()=>{}); }
    } catch (e) {
      alert('Camera unavailable: ' + e.message + '\nUse upload instead.');
      stopBookCam();
      openBookFilePicker();
    }
  }, 50);
}

function stopBookCam() {
  if (S.bookCapture?.stream) {
    S.bookCapture.stream.getTracks().forEach(t => t.stop());
    S.bookCapture.stream = null;
  }
}

function renderBookCam() {
  const pages = S.bookCapture?.pages || [];
  const lastThumb = pages.length ? pages[pages.length - 1].dataUrl : '';
  return `
    <div class="cam-screen">
      <video id="camVideo" class="cam-video" playsinline muted></video>
      <div class="cam-top">
        <div class="cam-chip">Page ${pages.length + 1}${S.bookCapture?.chapterTitle ? ' / ' + E(S.bookCapture.chapterTitle) : ''}</div>
        <button class="cam-chip" onclick="exitBookCam()" aria-label="Cancel">✕</button>
      </div>
      ${renderCountSelector({ compact: true })}
      <div class="cam-bottom">
        ${lastThumb ? `<img class="cam-thumb" src="${lastThumb}" alt="Last page" onclick="reviewBookPages()" />` : '<div class="cam-thumb"></div>'}
        <button class="cam-shutter" onclick="snapBookPage()" aria-label="Capture page"></button>
        ${pages.length ? `<button class="cam-done ready" onclick="finishBook()">Done · ${pages.length}</button>` : '<button class="cam-done" disabled>Done</button>'}
      </div>
    </div>
  `;
}

function snapBookPage() {
  const v = document.getElementById('camVideo');
  if (!v) return;
  const canvas = document.createElement('canvas');
  // Compress: max 1024 long edge
  const targetMax = 1024;
  let w = v.videoWidth, h = v.videoHeight;
  if (!w || !h) { alert('Camera not ready yet'); return; }
  const scale = Math.min(1, targetMax / Math.max(w, h));
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
  S.bookCapture.pages.push({ dataUrl, ts: Date.now() });
  // light haptic
  if (navigator.vibrate) navigator.vibrate(10);
  render();
}

function reviewBookPages() {
  // brief indicator; for v2 skip the full review screen since the test gate
  // doesn't require it and the upload flow covers verification
  if (!S.bookCapture?.pages.length) return;
  if (confirm('Drop last page?')) {
    S.bookCapture.pages.pop();
    render();
  }
}

function exitBookCam() {
  if (S.bookCapture?.pages.length && !confirm('Discard captured pages?')) return;
  stopBookCam();
  S.bookCapture = null;
  go('picker');
}

async function finishBook() {
  if (!S.bookCapture?.pages.length) return;
  stopBookCam();
  await processBookPages(S.bookCapture.pages, S.bookCapture.chapterTitle || '');
}

function openBookFilePicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true;
  input.capture = 'environment';
  input.onchange = async () => {
    if (!input.files?.length) return;
    const pages = [];
    for (const file of input.files) {
      const reader = new FileReader();
      const dataUrl = await new Promise((res, rej) => { reader.onload = () => res(reader.result); reader.onerror = rej; reader.readAsDataURL(file); });
      const compressed = await compressImage(dataUrl, 1024);
      pages.push({ dataUrl: compressed, ts: Date.now() });
    }
    await processBookPages(pages, '');
  };
  input.click();
}

function compressImage(dataUrl, maxDim = 1024, quality = 0.78) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

async function processBookPages(pages, chapterTitle) {
  if (!pages?.length) return;
  S.processing = true;
  go('capture-book');
  try {
    setProcStatus('Sending ' + pages.length + ' page' + plural(pages.length, '') + ' to Gemini…');
    const images = pages.map(p => p.dataUrl);
    const requestedCount = S.questionCount || 15;
    const result = await api('/api/analyze-book-chapter', {
      images,
      chapter_title: chapterTitle || null,
      question_count: requestedCount,
    }, 240000);
    if (result.error) throw new Error(result.error);
    sanitizeQuiz(result);
    S.lastProcessingSeconds = (typeof result.processing_seconds === 'number') ? result.processing_seconds : null;
    const sourceId = 'bk_' + uid();
    const title = result.title || result.chapter_title || chapterTitle || 'Book chapter';
    const sourceRec = { source_id: sourceId, type: 'book', url: null, title, analysis: result, transcript: result.summary || '', processed_at: nowISO(), page_count: pages.length };
    await dbPut('sources', sourceRec);
    if (!result.quiz?.length) throw new Error('Book analysis returned no usable quiz questions.');
    const quiz = { id: uid(), source_id: sourceId, source_title: title, source_type: 'book', quiz_type: 'initial', questions: result.quiz, created_at: nowISO() };
    await dbPut('quizzes', quiz);
    S.sources = await dbGetAll('sources');
    S.quizzes = await dbGetAll('quizzes');
    S.currentSource = sourceRec;
    S.currentQuiz = quiz;
    S.answers = {}; S.hints = {}; S.processing = false; S.results = null; S.promotedQuestionIdx = {};
    S.bookCapture = null;
    go('quiz');
  } catch (e) {
    S.processing = false;
    render();
    alert('Book chapter analysis failed: ' + e.message);
    go('picker');
  }
}

function renderCaptureBook() {
  return `
    <div class="screen fade-in center">
      <div class="spinner" style="margin: 64px auto var(--s-4);"></div>
      <h2 class="t-display-lg" style="margin-bottom: var(--s-2);">Reading your pages</h2>
      <p class="muted">Gemini is analyzing the captured images…</p>
      <div id="processStatus" class="muted" style="margin-top: var(--s-3); font-size: 13px;"></div>
    </div>
  `;
}

/* ============== 7. Quiz delivery + results ============== */

function renderQuiz() {
  const q = S.currentQuiz;
  if (!q) return `<div class="screen"><p class="muted">No quiz loaded.</p></div>`;
  const qs = q.questions || [];
  const total = qs.length;
  const answered = Object.keys(S.answers).length;
  const stamp = (typeof S.lastProcessingSeconds === 'number')
    ? ('Generated in ' + Math.round(S.lastProcessingSeconds) + 's')
    : '';

  let html = '';
  // For long quizzes (>24) the dot strip wraps badly — switch to a continuous
  // progress bar with a numeric Q-of-N counter so 100-question quizzes stay
  // legible on mobile. Below that threshold we keep the original dots which
  // give better at-a-glance "where am I" feedback.
  if (total > 24) {
    const pct = total ? Math.round((answered / total) * 100) : 0;
    html += `<div class="quiz-progress-bar">
              <div class="quiz-progress-bar-track">
                <div class="quiz-progress-bar-fill" style="width: ${pct}%;"></div>
              </div>
              <div class="quiz-progress-bar-meta">
                <div>
                  <span class="qpb-current">${answered}</span>
                  <span class="qpb-total"> / ${total} answered</span>
                </div>
                <div class="qpb-stamp">${stamp ? E(stamp) : ''}</div>
              </div>
            </div>`;
  } else {
    html += `<div class="quiz-progress">`;
    for (let i = 0; i < total; i++) {
      const cls = (i < answered) ? 'qdot done' : (i === answered ? 'qdot active' : 'qdot');
      html += `<div class="${cls}"></div>`;
    }
    html += `</div>`;
  }

  html += `<div class="screen">`;
  html += `<div class="row-between" style="margin-bottom: var(--s-3);">
            <button class="btn-link" onclick="confirmExitQuiz()" aria-label="Exit">
              <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="t-caption tertiary">${q.quiz_type === 'followup' ? 'Adaptive follow-up' : (q.source_type || 'Quiz')}${(total <= 24 && stamp) ? (' · ' + E(stamp)) : ''}</span>
          </div>`;

  qs.forEach((qu, i) => {
    const opts = (qu.options || []).map((o, idx) => ({ ...o, label: o.label || String.fromCharCode(65 + idx) }));
    const sel = S.answers[i];
    html += `<div class="q-stem" id="q${i}">`;
    html += `<div class="t-caption qcaption">Question ${i + 1} of ${total}</div>`;
    html += `<div class="t-display-lg qtext">${E(qu.question)}</div>`;
    html += `</div>`;
    html += `<div class="q-options">`;
    opts.forEach((o, oi) => {
      const cls = sel === o.label ? 'qopt selected' : 'qopt';
      html += `<button class="${cls}" onclick="pickOpt(${i}, '${E(o.label)}')">
                 <span class="label">${E(o.label)}</span>
                 <span>${E(o.text)}</span>
               </button>`;
    });
    html += `</div>`;
  });

  html += `<div style="margin-top: var(--s-6); padding: 0 var(--s-4);">
            <button class="btn btn-primary btn-block" onclick="submitQuiz()" ${answered < total ? 'disabled' : ''}>
              ${answered < total ? (total - answered) + ' remaining' : 'See results'}
            </button>
           </div>`;
  html += `</div>`;
  return html;
}

function confirmExitQuiz() {
  if (!Object.keys(S.answers).length || confirm('Discard quiz progress?')) {
    go('picker');
  }
}

function pickOpt(i, label) {
  S.answers[i] = label;
  const sy = window.scrollY;
  render();
  window.scrollTo(0, sy);
}

async function submitQuiz() {
  const q = S.currentQuiz;
  if (!q) return;
  // Score the quiz
  const r = scoreQuiz(q.questions || [], S.answers);
  S.results = r;
  // Persist quiz history row
  await dbPut('history', { id: Date.now(), quizId: q.id, source_id: q.source_id, timestamp: nowISO(), score: r.score, total: r.total, correct: r.correct });
  // Save to flashcards if toggle on
  if (S.saveToFlashcards) {
    await saveMissedAsCards(q, r);
  }
  // Profile streak update
  await bumpStreak();
  S.profile = await getProfile();
  S.dueCount = await getDueCount();
  // Push the count up to the server so the cron can read it
  syncDueCountUp().catch(() => {});
  go('results');
}

function scoreQuiz(questions, answers) {
  let correct = 0;
  const details = [];
  const wrong = [];
  questions.forEach((qu, i) => {
    const opts = (qu.options || []).map((o, idx) => ({ ...o, label: o.label || String.fromCharCode(65 + idx) }));
    const right = opts.find(o => o.correct);
    const sel = answers[i];
    const selOpt = opts.find(o => o.label === sel);
    const isCorrect = !!right && sel === right.label;
    if (isCorrect) correct++;
    const detail = {
      qIdx: i,
      question: qu.question,
      correct: isCorrect,
      selected: sel || null,
      selectedText: selOpt?.text || '',
      correctAnswer: right?.label || '',
      correctText: right?.text || '',
      whyWrong: !isCorrect ? (selOpt?.why_wrong || '') : '',
      explanation: qu.explanation || '',
      deeperInsight: qu.deeper_insight || '',
      misconception: qu.common_misconception || '',
      conceptName: qu.concept_name || '',
      topic: qu.topic || '',
    };
    details.push(detail);
    if (!isCorrect) wrong.push(detail);
  });
  const total = questions.length;
  const score = total ? Math.round((correct / total) * 100) : 0;
  return { score, correct, total, details, wrongAnswers: wrong };
}

async function bumpStreak() {
  const p = await getProfile();
  const today = new Date().toISOString().slice(0, 10);
  if (!Array.isArray(p.streak_history)) p.streak_history = [];
  if (!p.streak_history.includes(today)) p.streak_history.push(today);
  // Compute streak by walking back consecutive days from today
  const set = new Set(p.streak_history);
  let streak = 0;
  for (let d = 0; d < 365; d++) {
    const dt = new Date(); dt.setDate(dt.getDate() - d);
    const k = dt.toISOString().slice(0, 10);
    if (set.has(k)) streak++;
    else break;
  }
  p.streak_days = streak;
  p.last_review_date = today;
  // Trim old streak history
  if (p.streak_history.length > 800) p.streak_history = p.streak_history.slice(-800);
  await saveProfile(p);
  return p;
}

function renderResults() {
  const r = S.results;
  if (!r) return `<div class="screen"><p class="muted">No results yet.</p></div>`;
  const q = S.currentQuiz;
  const summary = (r.score >= 90) ? 'Strong showing.'
                : (r.score >= 70) ? 'Solid grasp on most of it.'
                : (r.score >= 50) ? 'Some shaky spots — saved them for review.'
                : 'Lots to revisit.';
  let html = `<div class="screen fade-in">`;
  html += `<div class="row-between" style="margin-bottom: var(--s-6);">
            <button class="btn-link" onclick="go('dashboard')" aria-label="Done">
              <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="t-caption tertiary">${E(q?.source_title || 'Results')}</span>
          </div>`;
  html += `<div class="t-mono-big" style="margin-bottom: var(--s-3);">${r.correct}/${r.total}</div>`;
  html += `<div class="t-body-lg t-serif-italic" style="color: var(--text-secondary); margin-bottom: var(--s-6);">${summary}</div>`;

  // Save-to-flashcards row
  const missedCount = r.total - r.correct;
  html += `<div class="card" style="margin-bottom: var(--s-3);">
            <div class="tog-row">
              <div>
                <div style="font-weight: 500;">Save missed to flashcards</div>
                <div class="muted" style="font-size: 13px;">${missedCount} missed question${plural(missedCount,'')} → cards</div>
              </div>
              <button class="tog ${S.saveToFlashcards ? 'on' : ''}" onclick="toggleSaveToCards()" aria-label="Save missed to flashcards"></button>
            </div>
          </div>`;

  // Per-question review
  html += `<div class="t-caption tertiary" style="margin: var(--s-6) 0 var(--s-2);">WHERE TO FOCUS</div>`;
  r.details.forEach((d, i) => {
    const right = d.correct;
    const promoted = !!S.promotedQuestionIdx[d.qIdx];
    html += `<div style="border-bottom: 1px solid var(--border-subtle); padding: var(--s-4) 0;">
              <div class="row-between" style="align-items: flex-start; gap: var(--s-3);">
                <div style="flex:1; min-width:0;">
                  <div class="row" style="gap:8px; margin-bottom: 6px;">
                    <span class="t-caption" style="color: ${right ? 'var(--success)' : 'var(--danger)'};">${right ? 'CORRECT' : 'INCORRECT'}</span>
                    <span class="t-caption tertiary">Q${i + 1}</span>
                  </div>
                  <div style="font-weight: 500; margin-bottom: 6px;">${E(d.question)}</div>
                  ${!right ? `<div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;">Correct: <strong>${E(d.correctAnswer)}</strong> ${E(d.correctText)}</div>` : ''}
                  ${d.explanation ? `<div style="font-size: 13px; color: var(--text-secondary);">${E(d.explanation)}</div>` : ''}
                </div>
                <button class="btn-link" title="${right ? 'Save as flashcard' : 'Already saved'}"
                        style="color: ${promoted ? 'var(--accent)' : 'var(--text-tertiary)'};"
                        onclick="promoteQuestionToCard(${i})" ${right ? '' : 'disabled aria-disabled="true"'}>
                  🔖
                </button>
              </div>
            </div>`;
  });

  // Adaptive follow-up button
  if (r.score < 85 && r.wrongAnswers.length) {
    html += `<div style="margin-top: var(--s-6);">
              <button class="btn btn-primary btn-block" onclick="requestFollowup()" ${S.processing ? 'disabled' : ''}>
                ${S.processing ? '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Building follow-up…' : 'Start adaptive follow-up'}
              </button>
              <button class="btn btn-link btn-block" onclick="go('dashboard')" style="margin-top: var(--s-2);">Save & exit</button>
             </div>`;
  } else {
    html += `<div style="margin-top: var(--s-6);"><button class="btn btn-primary btn-block" onclick="go('dashboard')">Done</button></div>`;
  }

  html += `</div>`;
  return html;
}

function toggleSaveToCards() {
  S.saveToFlashcards = !S.saveToFlashcards;
  // If turning on after results, save now
  if (S.saveToFlashcards && S.currentQuiz && S.results) {
    saveMissedAsCards(S.currentQuiz, S.results).then(()=>render());
  } else {
    // Note: we don't unsave already-saved cards; just toggle state for next time
    render();
  }
}

async function promoteQuestionToCard(i) {
  const r = S.results; const q = S.currentQuiz;
  if (!r || !q) return;
  const detail = r.details[i];
  if (!detail || !detail.correct) return;
  if (S.promotedQuestionIdx[i]) return;
  // Find the question by index in quiz
  const qu = q.questions[i];
  const right = (qu.options || []).find(o => o.correct);
  if (!right) return;
  const card = makeCard({
    front: qu.question,
    back: right.text,
    source_id: q.source_id,
    source_title: q.source_title,
    source_type: q.source_type,
    notes: qu.explanation || '',
    promoted: true,
  });
  await dbPut('cards', card);
  S.promotedQuestionIdx[i] = true;
  S.cards = await dbGetAll('cards');
  S.dueCount = await getDueCount();
  toast('Saved to flashcards');
  render();
}

async function saveMissedAsCards(quiz, r) {
  const wrong = r.wrongAnswers || [];
  if (!wrong.length) return;
  const allCards = await dbGetAll('cards');
  const existingFronts = new Set(allCards.filter(c => c.source_id === quiz.source_id).map(c => c.front));
  for (const w of wrong) {
    if (existingFronts.has(w.question)) continue;
    const card = makeCard({
      front: w.question,
      back: w.correctText,
      source_id: quiz.source_id,
      source_title: quiz.source_title,
      source_type: quiz.source_type,
      notes: w.explanation || '',
      promoted: false,
    });
    await dbPut('cards', card);
    existingFronts.add(w.question);
  }
  S.cards = await dbGetAll('cards');
  S.dueCount = await getDueCount();
}

function makeCard({ front, back, source_id, source_title, source_type, notes, promoted }) {
  const now = Date.now();
  return {
    id: uid(),
    front,
    back,
    source_id,
    source_title,
    source_type,
    notes: notes || '',
    promoted: !!promoted,
    created_at: nowISO(),
    last_review: null,
    next_due: nowISO(), // due immediately
    stability: 0,
    difficulty: 0,
    reps: 0,
    lapses: 0,
    consec_correct: 0,
    interval_days: 0,
    last_rating: null,
    status: 'new',
  };
}

async function requestFollowup() {
  const q = S.currentQuiz; const r = S.results;
  if (!q || !r) return;
  S.processing = true; render();
  try {
    const source = await dbGet('sources', q.source_id);
    const transcript = source?.transcript || '';
    const result = await api('/api/followup', {
      wrong_answers: r.wrongAnswers,
      weak_concepts: r.wrongAnswers.map(w => w.conceptName).filter(Boolean),
      transcript,
      original_quiz: q.questions || [],
      learner_context: { learning_style: {}, weak_areas: [], overall_accuracy: r.score },
    }, 240000);
    if (result.error) throw new Error(result.error);
    if (!result.quiz?.length) throw new Error('Follow-up generated no questions.');
    sanitizeQuiz(result);
    const followup = { id: uid(), source_id: q.source_id, source_title: q.source_title, source_type: q.source_type, quiz_type: 'followup', questions: result.quiz, focus_areas: result.focus_areas || [], diagnosis: result.diagnosis || '', teaching_strategy: result.teaching_strategy || '', created_at: nowISO() };
    await dbPut('quizzes', followup);
    S.quizzes = await dbGetAll('quizzes');
    S.currentQuiz = followup;
    S.answers = {}; S.hints = {}; S.results = null; S.processing = false; S.promotedQuestionIdx = {};
    go('quiz');
  } catch (e) {
    S.processing = false;
    render();
    alert('Follow-up failed: ' + e.message);
  }
}

/* ============== 8. Flashcards ============== */

async function loadCards() {
  S.cards = await dbGetAll('cards');
  S.dueCount = await getDueCount();
}

async function getDueCount() {
  const now = Date.now();
  const cards = await dbGetAll('cards');
  return cards.filter(c => c.status !== 'retired' && Date.parse(c.next_due) <= now).length;
}

async function getDueCards(limit = 50) {
  const now = Date.now();
  const cards = await dbGetAll('cards');
  return cards
    .filter(c => c.status !== 'retired' && Date.parse(c.next_due) <= now)
    .sort((a, b) => Date.parse(a.next_due) - Date.parse(b.next_due))
    .slice(0, limit);
}

function renderCardsHome() {
  const total = S.cards.length;
  const learning = S.cards.filter(c => c.status === 'learning' || c.status === 'new').length;
  const reviewing = S.cards.filter(c => c.status === 'reviewing').length;
  const mastered = S.cards.filter(c => c.status === 'mastered' || c.status === 'retired').length;
  const due = S.dueCount;
  const bySource = {};
  S.cards.forEach(c => {
    const k = c.source_title || 'Unknown';
    if (!bySource[k]) bySource[k] = { count: 0, due: 0, source_id: c.source_id, source_type: c.source_type };
    bySource[k].count++;
    if (c.status !== 'retired' && Date.parse(c.next_due) <= Date.now()) bySource[k].due++;
  });

  let html = `<div class="screen fade-in">`;
  html += `<div class="t-caption tertiary" style="margin-bottom: 4px;">Flashcards</div>`;
  html += `<h1 class="t-display-xl" style="margin-bottom: var(--s-6);">Your deck</h1>`;
  html += `<div class="row" style="gap: var(--s-6); margin-bottom: var(--s-6);">
            <div><div class="t-mono-big" style="font-size: 36px;">${total}</div><div class="t-caption tertiary">Total</div></div>
            <div><div class="t-mono-big" style="font-size: 36px; color: ${due ? 'var(--accent)' : 'var(--text-primary)'};">${due}</div><div class="t-caption tertiary">Due</div></div>
            <div><div class="t-mono-big" style="font-size: 36px; color: var(--success);">${mastered}</div><div class="t-caption tertiary">Mastered</div></div>
           </div>`;

  if (total === 0) {
    html += `<div class="card" style="text-align: center; padding: var(--s-8) var(--s-4);">
              <div class="t-display-lg" style="margin-bottom: var(--s-2);">No cards yet</div>
              <p class="muted" style="margin-bottom: var(--s-6);">Take a quiz and miss something — or tap the bookmark on a correct answer.</p>
              <button class="btn btn-primary" onclick="go('picker')">Add a source</button>
             </div>`;
  } else {
    if (due > 0) {
      html += `<button class="btn btn-primary btn-block" onclick="startReview()">Review ${due} card${plural(due,'')}</button>`;
    } else {
      html += `<div class="banner">Nothing due right now. Next card unlocks at ${formatRelativeNextDue()}.</div>`;
    }
    html += `<div class="section-h">By source</div>`;
    Object.keys(bySource).forEach(name => {
      const b = bySource[name];
      html += `<div class="list-row">
                <div class="lr-glyph">${sourceGlyph(b.source_type)}</div>
                <div class="lr-body">
                  <div class="lr-title">${E(name)}</div>
                  <div class="lr-meta">${b.count} cards · ${b.due} due</div>
                </div>
                ${phaseSVG(deckPhase(name))}
               </div>`;
    });
  }
  html += `</div>`;
  return html;
}

function deckPhase(name) {
  // Aggregate phase across cards in this deck
  const cards = S.cards.filter(c => (c.source_title || 'Unknown') === name);
  if (!cards.length) return 0;
  const avg = cards.reduce((a, c) => a + cardPhase(c), 0) / cards.length;
  return Math.round(avg);
}

function sourceGlyph(t) {
  return t === 'youtube' ? '▸' : t === 'podcast' ? '◉' : t === 'book' ? 'ⅵ' : '✱';
}

function formatRelativeNextDue() {
  if (!S.cards.length) return '—';
  const next = S.cards.filter(c => c.status !== 'retired').reduce((a, c) => Math.min(a, Date.parse(c.next_due)), Infinity);
  if (!isFinite(next)) return '—';
  const diff = next - Date.now();
  if (diff <= 0) return 'now';
  const days = Math.round(diff / FSRS_DAY_MS);
  if (days === 0) return 'later today';
  if (days === 1) return 'tomorrow';
  return 'in ' + days + ' days';
}

async function startReview() {
  const due = await getDueCards(50);
  if (!due.length) { toast('Nothing due right now.'); return; }
  S.currentReview = { cards: due, i: 0, revealed: false, sessionId: uid(), reviewed: 0 };
  go('review');
}

function renderReview() {
  const rs = S.currentReview;
  if (!rs || !rs.cards.length) {
    return `<div class="screen"><p class="muted">No review session.</p></div>`;
  }
  const total = rs.cards.length;
  if (rs.i >= total) {
    return `<div class="fc-screen">
      <div class="screen fade-in" style="margin: auto; max-width: 360px; text-align: center;">
        <div class="t-mono-big" style="margin-bottom: var(--s-3);">${rs.reviewed}</div>
        <div class="t-display-lg t-serif-italic" style="margin-bottom: var(--s-6);">cards reviewed</div>
        <button class="btn btn-primary btn-block" onclick="go('cards')">Done</button>
      </div>
    </div>`;
  }
  const card = rs.cards[rs.i];
  const left = total - rs.i;
  const phase = phaseSVG(cardPhase(card), true);
  return `
    <div class="fc-screen">
      <div class="fc-topbar">
        <button class="fc-exit" onclick="exitReview()" aria-label="Exit"><svg class="icon icon-24" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div>${phase}</div>
        <div class="fc-count t-mono-num">${left} left</div>
      </div>
      <div class="fc-main">
        <div id="fcQ" class="fc-q ${rs.revealed ? 'dimmed' : ''}" onclick="revealCard()">${E(card.front)}</div>
        <div id="fcA" class="fc-a ${rs.revealed ? 'shown' : ''}">${E(card.back)}</div>
        ${!rs.revealed ? `<div class="fc-tap-hint">Tap to reveal</div>` : ''}
      </div>
      <div class="fc-rating ${rs.revealed ? 'shown' : ''}">
        <button class="fc-rate again" onclick="rateCard(1)"><div class="num">1</div><div class="lab">Again</div></button>
        <button class="fc-rate hard"  onclick="rateCard(2)"><div class="num">2</div><div class="lab">Hard</div></button>
        <button class="fc-rate good"  onclick="rateCard(3)"><div class="num">3</div><div class="lab">Good</div></button>
        <button class="fc-rate easy"  onclick="rateCard(4)"><div class="num">4</div><div class="lab">Easy</div></button>
      </div>
    </div>
  `;
}

function revealCard() {
  if (!S.currentReview) return;
  if (S.currentReview.revealed) return;
  S.currentReview.revealed = true;
  render();
}

async function rateCard(rating) {
  const rs = S.currentReview;
  if (!rs) return;
  if (!rs.revealed) { revealCard(); return; }
  const card = rs.cards[rs.i];
  const updated = fsrsUpdate(card, rating);
  await dbPut('cards', updated);
  rs.cards[rs.i] = updated;
  rs.reviewed++;
  rs.i++;
  rs.revealed = false;
  // refresh global cards list
  S.cards = await dbGetAll('cards');
  S.dueCount = await getDueCount();
  syncDueCountUp().catch(() => {});
  render();
}

function exitReview() {
  if (!confirm('End review session?')) return;
  S.currentReview = null;
  go('cards');
}

document.addEventListener('keydown', (e) => {
  if (S.view !== 'review') return;
  if (!S.currentReview) return;
  if (!S.currentReview.revealed && (e.key === ' ' || e.key === 'Enter')) {
    revealCard(); e.preventDefault(); return;
  }
  if (S.currentReview.revealed && /^[1-4]$/.test(e.key)) {
    rateCard(parseInt(e.key, 10)); e.preventDefault();
  }
});

/* ============== 9. Dashboard + history + settings ============== */

function renderDashboard() {
  const p = S.profile || {};
  const due = S.dueCount;
  const dayName = new Date().toLocaleDateString(undefined, { weekday: 'long' });
  const greeting = (new Date().getHours() < 12) ? `${dayName} morning,` : (new Date().getHours() < 18) ? `${dayName} afternoon,` : `${dayName} evening,`;
  const minutes = Math.max(1, Math.round(due * 0.4));
  let html = `<div class="hero fade-in">`;
  html += `<div class="t-caption greeting">${E(greeting)}</div>`;
  if (due > 0) {
    html += `<div class="t-mono-hero due-num">${due}</div>`;
    html += `<div class="t-serif-italic due-label">card${plural(due,'')} due</div>`;
    html += `<div class="t-body est">~${minutes} minute${plural(minutes,'')}</div>`;
    html += `<button class="btn btn-primary btn-block" onclick="startReview()">Start review →</button>`;
  } else {
    html += `<div class="t-display-xl" style="margin-bottom: var(--s-3);">Nothing due today</div>`;
    html += `<div class="t-body-lg muted" style="margin-bottom: var(--s-6);">Capture something new to keep the streak alive.</div>`;
    html += `<div class="row" style="gap: var(--s-2);">`;
    html += `<button class="btn btn-primary" style="flex:1;" onclick="go('picker')">+ New source</button>`;
    if (S.cards.length > 0) html += `<button class="btn" style="flex:1;" onclick="reviewAhead()">Review ahead</button>`;
    html += `</div>`;
  }

  // Streak strip
  const streak = p.streak_days || 0;
  const set = new Set(p.streak_history || []);
  html += `<div class="streak-strip">`;
  for (let i = 7; i >= 0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const k = dt.toISOString().slice(0, 10);
    html += `<div class="streak-bar ${set.has(k) ? 'on' : ''}"></div>`;
  }
  html += `</div>`;
  html += `<div class="t-caption tertiary" style="margin-top: var(--s-2);">${streak}-day streak</div>`;

  html += `</div>`;

  // Recent sources
  html += `<div class="screen" style="padding-top: 0;">`;
  if (S.sources.length) {
    html += `<div class="section-h">Recent</div>`;
    S.sources.slice().sort((a,b) => Date.parse(b.processed_at) - Date.parse(a.processed_at)).slice(0, 6).forEach(s => {
      html += `<div class="list-row" onclick="openSource('${E(s.source_id)}')">
                <div class="lr-glyph">${sourceGlyph(s.type)}</div>
                <div class="lr-body">
                  <div class="lr-title">${E(s.title)}</div>
                  <div class="lr-meta">${E(s.type)} · ${new Date(s.processed_at).toLocaleDateString()}</div>
                </div>
                <button class="btn btn-sm" onclick="event.stopPropagation();takeSourceQuiz('${E(s.source_id)}')">Quiz</button>
               </div>`;
    });
  }
  if (!S.serverOk) {
    html += `<div class="banner warning" style="margin-top: var(--s-6);">
              <strong>Backend offline.</strong> The proxy at ${E(S.proxyUrl)} isn't responding. Quizzes won't work until it's healthy.
             </div>`;
  }
  html += `</div>`;
  return html;
}

function openSource(id) {
  const s = S.sources.find(x => x.source_id === id);
  if (!s) return;
  S.currentSource = s;
  // jump straight to the quiz for this source if there is one
  takeSourceQuiz(id);
}
function takeSourceQuiz(id) {
  const q = S.quizzes.filter(q => q.source_id === id && q.quiz_type === 'initial')[0];
  if (!q) { toast('No quiz saved for this source'); return; }
  S.currentQuiz = q; S.answers = {}; S.results = null; S.hints = {}; S.promotedQuestionIdx = {};
  go('quiz');
}

async function reviewAhead() {
  const cards = await dbGetAll('cards');
  if (!cards.length) { toast('No cards yet'); return; }
  const upcoming = cards.filter(c => c.status !== 'retired').sort((a, b) => Date.parse(a.next_due) - Date.parse(b.next_due)).slice(0, 10);
  S.currentReview = { cards: upcoming, i: 0, revealed: false, sessionId: uid(), reviewed: 0 };
  go('review');
}

function renderHistory() {
  let html = `<div class="screen fade-in">`;
  html += `<div class="t-caption tertiary" style="margin-bottom: 4px;">History</div>`;
  html += `<h1 class="t-display-xl" style="margin-bottom: var(--s-6);">Recent</h1>`;
  if (!S.sources.length) {
    html += `<p class="muted">Nothing yet.</p>`;
  } else {
    S.sources.slice().sort((a,b) => Date.parse(b.processed_at) - Date.parse(a.processed_at)).forEach(s => {
      const cardCount = S.cards.filter(c => c.source_id === s.source_id).length;
      html += `<div class="list-row" onclick="takeSourceQuiz('${E(s.source_id)}')">
                <div class="lr-glyph">${sourceGlyph(s.type)}</div>
                <div class="lr-body">
                  <div class="lr-title">${E(s.title)}</div>
                  <div class="lr-meta">${E(s.type)} · ${cardCount} card${plural(cardCount,'')} · ${new Date(s.processed_at).toLocaleDateString()}</div>
                </div>
                ${phaseSVG(deckPhase(s.title))}
               </div>`;
    });
  }
  html += `</div>`;
  return html;
}

function renderSettings() {
  const m = S.modelInfo || {};
  return `<div class="screen fade-in">
    <div class="t-caption tertiary" style="margin-bottom: 4px;">Settings</div>
    <h1 class="t-display-xl" style="margin-bottom: var(--s-6);">Configuration</h1>
    <div class="card">
      <div class="kvline"><span class="k">Version</span><span class="v">${E(APP_VERSION)}</span></div>
      <div class="kvline"><span class="k">Backend</span><span class="v"><span class="activity-dot ${S.serverOk ? '' : 'off'}"></span>${S.serverOk ? 'online' : 'offline'}</span></div>
      <div class="kvline"><span class="k">Proxy</span><span class="v" style="font-size: 11px;">${E(S.proxyUrl)}</span></div>
      ${m.haiku ? `
        <div class="kvline"><span class="k">Bulk model</span><span class="v">${E(m.haiku)}</span></div>
        <div class="kvline"><span class="k">Reasoning</span><span class="v">${E(m.sonnet)}</span></div>
      `: ''}
      <div class="kvline"><span class="k">Total cards</span><span class="v">${S.cards.length}</span></div>
      <div class="kvline"><span class="k">Due now</span><span class="v">${S.dueCount}</span></div>
    </div>
    <div class="section-h">Defaults</div>
    <div class="card">
      <div class="tog-row">
        <div><div style="font-weight: 500;">Save missed to flashcards</div>
             <div class="muted" style="font-size: 13px;">Toggle on quiz results</div></div>
        <button class="tog ${S.saveToFlashcards ? 'on' : ''}" onclick="S.saveToFlashcards=!S.saveToFlashcards;render();"></button>
      </div>
    </div>
    <div class="section-h">Reset</div>
    <button class="btn" style="background: var(--danger-soft); color: var(--danger);" onclick="if(confirm('Delete all data? Cannot be undone.'))resetAll()">Reset all data</button>
  </div>`;
}

async function resetAll() {
  for (const s of ['profile','sources','quizzes','history','cards','settings','videos']) {
    try { await dbClear(s); } catch (e) {}
  }
  await loadCards();
  S.sources = []; S.quizzes = []; S.profile = await getProfile();
  go('dashboard');
}

/* ============== Toast ============== */
function toast(msg) {
  const old = document.getElementById('toast'); if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'toast';
  div.textContent = msg;
  div.style.cssText = 'position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--bg-overlay);color:var(--text-primary);padding:10px 16px;border-radius:8px;font-size:14px;border:1px solid var(--border-default);z-index:200;animation:fadeIn .2s ease-out';
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2200);
}

/* ============== Sync due-count to server (for cron) ============== */
async function syncDueCountUp() {
  try {
    await fetch(API_BASE + '/api/sync-due-count', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ count: S.dueCount, ts: nowISO(), client: APP_VERSION })
    });
  } catch (e) { /* best effort */ }
}

/* ============== 10. Boot ============== */
async function boot() {
  await openDB();
  S.profile = await getProfile();
  S.sources = await dbGetAll('sources');
  S.quizzes = await dbGetAll('quizzes');
  await loadCards();
  S.proxyUrl = API_BASE || location.origin;
  // Health check (non-blocking — UI renders immediately, status fills in
  // when the warm-up ping resolves, even if cold-start takes 10-15s).
  S.serverOk = false;
  apiGet('/api/health', 20000).then(h => {
    S.serverOk = !!h?.has_api_key;
    S.modelInfo = h?.models || null;
    try { render(); } catch (e) {}
  }).catch(() => { /* ignore — first analyze call will surface real errors */ });
  // Default route: deep links
  const hash = location.hash.replace('#', '');
  if (hash === 'review' && S.dueCount > 0) {
    await startReview();
  } else if (hash === 'picker') {
    go('picker');
  } else if (hash === 'cards') {
    go('cards');
  } else {
    render();
  }
  // Push due count for cron
  syncDueCountUp().catch(() => {});
}

boot();
</script>
</body>
</html>
