<style>
/* ================= DESIGN TOKENS (UI direction §2) ================= */
:root {
  /* Color */
  --bg-canvas:        #14130F;
  --bg-surface:       #1C1B17;
  --bg-surface-alt:   #232117;
  --bg-overlay:       #2A2823;

  --border-subtle:    #2A2823;
  --border-default:   #36332C;
  --border-strong:    #4A463D;

  --text-primary:     #F5F2EA;
  --text-secondary:   #C2BDB0;
  --text-tertiary:    #8B8676;
  --text-disabled:    #5C584F;

  --accent:           #D97757;
  --accent-hover:     #E08566;
  --accent-pressed:   #C26A4D;
  --accent-soft:      #3A2620;

  --success:          #7BA77F;
  --success-soft:     #1F2A22;
  --warning:          #C9A961;
  --warning-soft:     #2D2519;
  --danger:           #C46060;
  --danger-soft:      #2A1818;

  --focus-ring:       rgba(217, 119, 87, 0.35);

  /* Type */
  --font-display: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --font-body:    "Inter", "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  --font-mono:    "JetBrains Mono", "JetBrains Mono Variable", ui-monospace, "SF Mono", Menlo, monospace;

  /* Motion */
  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out:  cubic-bezier(0.65, 0, 0.35, 1);
  --ease-in:      cubic-bezier(0.55, 0, 1, 0.45);
  --dur-instant:  80ms;
  --dur-fast:     160ms;
  --dur-base:     240ms;
  --dur-slow:     400ms;

  /* Space */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px;
  --s-8: 32px; --s-12: 48px; --s-16: 64px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
}

/* ================= RESET + BASE ================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 22px;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  overscroll-behavior-y: none;
}
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* ================= TYPOGRAPHY ================= */
.t-display-2xl { font-family: var(--font-display); font-size: 42px; line-height: 48px; font-weight: 400; letter-spacing: -0.02em; }
.t-display-xl  { font-family: var(--font-display); font-size: 32px; line-height: 38px; font-weight: 400; letter-spacing: -0.01em; }
.t-display-lg  { font-family: var(--font-display); font-size: 24px; line-height: 30px; font-weight: 400; letter-spacing: -0.005em; }
.t-title       { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
.t-body-lg     { font-size: 17px; line-height: 26px; font-weight: 400; letter-spacing: -0.005em; }
.t-body        { font-size: 15px; line-height: 22px; font-weight: 400; }
.t-body-sm     { font-size: 13px; line-height: 18px; font-weight: 400; }
.t-caption     { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.t-mono-num    { font-family: var(--font-mono); font-size: 14px; line-height: 18px; font-weight: 500; }
.t-mono-hero   { font-family: var(--font-mono); font-size: 96px; line-height: 1; font-weight: 500; letter-spacing: -0.02em; }
.t-mono-big    { font-family: var(--font-mono); font-size: 64px; line-height: 1; font-weight: 500; letter-spacing: -0.01em; }
.t-serif-italic { font-family: var(--font-display); font-style: italic; }

/* ================= LAYOUT ================= */
.app {
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: 72px; /* space for tab bar */
  min-height: 100vh;
  position: relative;
}
.screen { padding: var(--s-6) var(--s-4) var(--s-6); }
.screen-flush { padding: 0; }
.row { display: flex; align-items: center; gap: var(--s-3); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); }
.col { display: flex; flex-direction: column; gap: var(--s-3); }
.spacer { flex: 1; }
.hidden { display: none !important; }
.muted { color: var(--text-secondary); }
.tertiary { color: var(--text-tertiary); }
.center { text-align: center; }

/* ================= TAB BAR ================= */
.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  z-index: 50;
}
.tabbar-inner { max-width: 480px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-around; padding: 0 var(--s-4); position: relative; }
.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  padding: 8px 4px;
  background: transparent;
  border: 0;
  color: var(--text-tertiary);
  position: relative;
  height: 64px;
}
.tab.active { color: var(--text-primary); }
.tab.active::after {
  content: ""; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 18px; height: 2px; background: var(--accent); border-radius: 1px;
}
.tab svg { width: 22px; height: 22px; stroke-width: 1.5; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.tab-label { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.02em; }

.tab-fab {
  width: 48px; height: 48px;
  border-radius: 24px;
  background: var(--accent);
  color: var(--text-primary);
  display: flex; align-items: center; justify-content: center;
  border: 0;
  box-shadow: 0 4px 16px var(--accent-soft);
  transform: translateY(-12px);
  transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.tab-fab:hover { background: var(--accent-hover); }
.tab-fab:active { background: var(--accent-pressed); transform: translateY(-10px); }
.tab-fab svg { width: 22px; height: 22px; stroke-width: 2; }

/* ================= BUTTONS ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: 0 var(--s-6);
  height: 56px;
  border-radius: var(--r-md);
  border: 0;
  font-size: 15px; font-weight: 600; letter-spacing: -0.005em;
  background: var(--bg-surface-alt);
  color: var(--text-primary);
  transition: background var(--dur-fast) var(--ease-out), transform var(--dur-instant) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.99); }
.btn-primary { background: var(--accent); color: var(--text-primary); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-pressed); }
.btn-primary:disabled { background: var(--bg-overlay); color: var(--text-disabled); }
.btn-ghost { background: transparent; color: var(--text-secondary); height: 44px; padding: 0 var(--s-3); }
.btn-ghost:hover { color: var(--text-primary); }
.btn-block { width: 100%; }
.btn-sm { height: 36px; padding: 0 var(--s-3); font-size: 13px; border-radius: var(--r-sm); }
.btn-link { background: transparent; color: var(--text-secondary); padding: var(--s-2); height: auto; font-weight: 500; }
.btn-link:hover { color: var(--text-primary); }

/* ================= INPUTS ================= */
.field {
  width: 100%;
  height: 56px;
  padding: 0 var(--s-4);
  background: var(--bg-surface-alt);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  color: var(--text-primary);
  font-size: 17px; line-height: 26px;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.field:focus { outline: none; border-color: var(--border-strong); background: var(--bg-overlay); }
.field::placeholder { color: var(--text-tertiary); }
textarea.field { padding: 14px var(--s-4); height: auto; min-height: 100px; resize: vertical; line-height: 22px; font-size: 15px; }

/* ================= SOURCE PICKER ================= */
.picker-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s-3);
  margin-top: var(--s-6);
}
.picker-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  padding: var(--s-4) var(--s-4) var(--s-4);
  height: 156px;
  display: flex; flex-direction: column; justify-content: space-between;
  text-align: left;
  color: var(--text-primary);
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-instant) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.picker-card:hover { background: var(--bg-surface-alt); border-color: var(--border-strong); }
.picker-card:active { transform: scale(0.98); }
.picker-card .glyph {
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 32px;
  color: var(--accent);
  font-feature-settings: "liga";
}
.picker-card .glyph-italic { font-style: italic; }
.picker-card .ptype { font-size: 17px; font-weight: 600; line-height: 22px; }
.picker-card .pinput { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.picker-card .pmeta { font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.02em; }

/* ================= CARDS ================= */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  padding: var(--s-4) var(--s-4);
}
.card-flat {
  border: 0;
  background: transparent;
  padding: 0;
}

/* ================= DASHBOARD HERO ================= */
.hero { padding: var(--s-6) var(--s-4) var(--s-4); }
.hero .greeting { color: var(--text-tertiary); margin-bottom: var(--s-4); }
.hero .due-num { color: var(--text-primary); margin-bottom: 4px; }
.hero .due-label { font-size: 22px; line-height: 28px; color: var(--text-secondary); margin-bottom: var(--s-3); }
.hero .est { color: var(--text-secondary); margin-bottom: var(--s-6); }

.streak-strip { display: flex; gap: 6px; margin-top: var(--s-6); }
.streak-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--border-default); }
.streak-bar.on { background: var(--accent); }

/* ================= QUIZ ================= */
.quiz-progress {
  display: flex; gap: 8px; padding: var(--s-4) var(--s-4) 0;
  align-items: center;
}
.qdot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-default); transition: background var(--dur-fast) var(--ease-out); }
.qdot.active { background: var(--accent); }
.qdot.done { background: var(--text-tertiary); }

/* For long quizzes (>24 questions) the dot strip wraps badly — use a continuous
   progress bar with a numeric counter so 100-question quizzes stay legible on
   mobile. */
.quiz-progress-bar {
  padding: var(--s-4) var(--s-4) 0;
}
.quiz-progress-bar-track {
  height: 4px;
  background: var(--border-default);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.quiz-progress-bar-fill {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: var(--accent);
  border-radius: 2px;
  transition: width var(--dur-base) var(--ease-out);
}
.quiz-progress-bar-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 6px;
  color: var(--text-tertiary);
}
.quiz-progress-bar-meta .qpb-current {
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 500;
  color: var(--text-primary);
}
.quiz-progress-bar-meta .qpb-total {
  font-family: var(--font-mono);
  font-size: 12px;
}
.quiz-progress-bar-meta .qpb-stamp {
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ================= QUESTION-COUNT SELECTOR ================= */
.qc-selector { margin-top: var(--s-6); }
.qc-label {
  font-size: 12px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: var(--s-2);
}
.qc-pills {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--s-2);
}
.qc-pill, .qc-custom {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  padding: var(--s-2) 4px;
  min-height: 60px;
  background: var(--bg-surface-alt);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  color: var(--text-secondary);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out),
              background var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
  font-size: inherit;
  text-align: center;
}
.qc-pill.on, .qc-custom.on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--text-primary);
}
.qc-pill-label {
  font-size: 10px; line-height: 12px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-tertiary);
}
.qc-pill.on .qc-pill-label, .qc-custom.on .qc-pill-label { color: var(--accent); }
.qc-pill-num {
  font-family: var(--font-mono);
  font-size: 17px; line-height: 22px; font-weight: 500;
  color: var(--text-primary);
}
.qc-pill.on .qc-pill-num { color: var(--accent); }
.qc-custom input {
  background: transparent;
  border: 0;
  width: 48px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 17px; line-height: 22px; font-weight: 500;
  color: var(--text-primary);
  padding: 0;
  -moz-appearance: textfield;
}
.qc-custom input::-webkit-outer-spin-button,
.qc-custom input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qc-custom input:focus { outline: none; }
.qc-custom input::placeholder { color: var(--text-tertiary); }
.qc-hint {
  margin-top: var(--s-3);
  color: var(--text-tertiary);
  font-size: 12px;
  line-height: 16px;
}
.qc-cost {
  margin-top: 6px;
  color: var(--text-tertiary);
  font-size: 11px;
  line-height: 15px;
  font-style: italic;
  font-family: var(--font-display);
}

/* Compact variant for camera overlay — same controls, tighter padding,
   horizontally scrolling instead of grid so it never wraps awkwardly. */
.qc-selector-compact {
  position: absolute;
  left: 12px; right: 12px;
  bottom: 116px;
  background: rgba(20, 19, 15, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: var(--r-md);
  padding: var(--s-2) var(--s-3);
  z-index: 5;
}
.qc-selector-compact .qc-label { margin-bottom: 6px; }
.qc-selector-compact .qc-pills { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.qc-selector-compact .qc-pill,
.qc-selector-compact .qc-custom { min-height: 44px; }
.qc-selector-compact .qc-pill-num,
.qc-selector-compact .qc-custom input { font-size: 14px; line-height: 18px; }
.qc-selector-compact .qc-pill-label { font-size: 9px; }
.qc-selector-compact .qc-hint,
.qc-selector-compact .qc-cost { display: none; }
.q-stem { padding: var(--s-6) var(--s-4) var(--s-4); }
.q-stem .qcaption { color: var(--text-tertiary); margin-bottom: var(--s-3); }
.q-stem .qtext { color: var(--text-primary); }
.q-options { padding: 0 var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); }
.qopt {
  width: 100%;
  min-height: 64px;
  padding: var(--s-3) var(--s-4);
  background: var(--bg-surface-alt);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  color: var(--text-primary);
  text-align: left;
  font-size: 15px; line-height: 22px; font-weight: 500;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  display: flex; align-items: flex-start; gap: var(--s-3);
}
.qopt:hover { background: var(--bg-overlay); }
.qopt .label { font-family: var(--font-mono); color: var(--text-tertiary); font-weight: 500; min-width: 16px; }
.qopt.selected { border-color: var(--border-strong); background: var(--bg-overlay); }
.qopt.correct { border-color: var(--success); background: var(--success-soft); }
.qopt.correct .label { color: var(--success); }
.qopt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.qopt.wrong .label { color: var(--danger); }

/* ================= FLASHCARDS ================= */
.fc-screen {
  position: fixed; inset: 0;
  background: var(--bg-canvas);
  z-index: 100;
  display: flex; flex-direction: column;
}
.fc-topbar {
  height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--s-4);
  border-bottom: 0;
  background: var(--bg-canvas);
}
.fc-exit {
  background: transparent; border: 0; color: var(--text-secondary);
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
}
.fc-count { color: var(--text-tertiary); }

.fc-main {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 var(--s-6);
  text-align: center;
}
.fc-q {
  font-family: var(--font-display);
  font-size: 28px; line-height: 36px; font-weight: 400;
  color: var(--text-primary);
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  max-width: 360px;
}
.fc-q.dimmed { opacity: 0.6; transform: translateY(-8px); }
.fc-a {
  font-family: var(--font-body);
  font-size: 17px; line-height: 26px; font-weight: 500;
  color: var(--text-primary);
  margin-top: var(--s-6);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity var(--dur-base) var(--ease-out) 80ms, transform var(--dur-base) var(--ease-out) 80ms;
  max-width: 360px;
}
.fc-a.shown { opacity: 1; transform: translateY(0); }
.fc-tap-hint { color: var(--text-tertiary); margin-bottom: var(--s-6); position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; }

.fc-rating {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--bg-surface-alt);
  border-top: 1px solid var(--border-subtle);
  opacity: 0; transform: translateY(20px);
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
}
.fc-rating.shown { opacity: 1; transform: translateY(0); }
.fc-rate {
  background: transparent;
  border: 0;
  border-right: 1px solid var(--border-subtle);
  height: 92px;
  padding: var(--s-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--text-secondary);
  transition: background var(--dur-fast) var(--ease-out);
}
.fc-rate:last-child { border-right: 0; }
.fc-rate .num { font-family: var(--font-mono); color: var(--text-tertiary); font-size: 13px; font-weight: 500; }
.fc-rate .glyph { font-size: 18px; margin-top: 2px; }
.fc-rate .lab { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
.fc-rate.again .lab { color: var(--danger); }
.fc-rate.hard .lab  { color: var(--warning); }
.fc-rate.good .lab  { color: var(--success); }
.fc-rate.easy .lab  { color: var(--text-secondary); }

<script>
/* ===========================================================================
   LearnEngine v2 — single-file vanilla app
   Sections:
     1. Config
     2. Helpers (HTML escape, fetch wrapper)
     3. IndexedDB
     4. FSRS-6 scheduler
     5. State + routing
     6. Source picker + capture flows (YouTube, Podcast, Book)
     7. Quiz delivery + results
     8. Flashcards (review session, deck overview, save toggle, promote)
     9. Dashboard + history + settings
    10. Boot
   =========================================================================== */

/* ============== 1. Config ============== */
function getApiBase() {
  if (location.hostname === 'mikedmote52.github.io') {
    const m = document.querySelector('meta[name="learnengine-api-base"]');
    return (m && m.content) ? m.content.replace(/\/$/, '') : '';
  }
  return ''; // same-origin for Vercel deploy or local dev
}
const API_BASE = getApiBase();
const APP_VERSION = 'v2.0';

/* Cold-start warmup: fire-and-forget GET to /api/health the moment the script
   parses, so the Vercel function is spinning up while the user types. By the
   time they hit "Add to library," the function is already warm and the
   analyze call doesn't pay the 5-15s cold-start tax. */
try {
  fetch(API_BASE + '/api/health', { method: 'GET', cache: 'no-store' })
    .catch(() => { /* best effort, never throw */ });
} catch (e) { /* noop */ }

/* ============== 2. Helpers ============== */
function E(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function nowISO() { return new Date().toISOString(); }
function plural(n, w) { return n === 1 ? w : w + 's'; }

async function api(path, body, timeoutMs = 240000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      signal: ctl.signal,
    });
    clearTimeout(timer);
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const msg = (data && data.error) || ('API ' + res.status);
      const err = new Error(msg);
      err.payload = data;
      err.status = res.status;
      throw err;
    }
    return data;
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('Request timed out (proxy may be cold-starting)');
    throw e;
  }
}
async function apiGet(path, timeoutMs = 10000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(API_BASE + path, { signal: ctl.signal });
    clearTimeout(timer);
    return await res.json();
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

/* ============== 3. IndexedDB ============== */
const DB_NAME = 'LearnEngineDB';
const DB_VER = 5; // bumped for cards store
let idb = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('profile')) db.createObjectStore('profile', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('sources')) db.createObjectStore('sources', { keyPath: 'source_id' });
      if (!db.objectStoreNames.contains('quizzes')) db.createObjectStore('quizzes', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('cards')) {
        const cards = db.createObjectStore('cards', { keyPath: 'id' });
        cards.createIndex('next_due', 'next_due');
        cards.createIndex('source_id', 'source_id');
        cards.createIndex('status', 'status');
      }
      // legacy v1 stores left intact for migration view
      if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'video_id' });
    };
    req.onsuccess = (e) => { idb = e.target.result; resolve(idb); };
    req.onerror = (e) => reject(e);
  });
}
function tx(store, mode = 'readonly') { return idb.transaction(store, mode).objectStore(store); }
function dbGet(store, key) { return new Promise((res, rej) => { const r = tx(store).get(key); r.onsuccess = () => res(r.result); r.onerror = rej; }); }
function dbPut(store, val) { return new Promise((res, rej) => { const r = tx(store, 'readwrite').put(val); r.onsuccess = () => res(r.result); r.onerror = rej; }); }
function dbDelete(store, key) { return new Promise((res, rej) => { const r = tx(store, 'readwrite').delete(key); r.onsuccess = () => res(); r.onerror = rej; }); }
function dbGetAll(store) { return new Promise((res, rej) => { const r = tx(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = rej; }); }
function dbClear(store) { return new Promise((res, rej) => { const r = tx(store, 'readwrite').clear(); r.onsuccess = () => res(); r.onerror = rej; }); }

async function getProfile() {
  let p = await dbGet('profile', 'main');
  if (!p) p = { id: 'main', totalQuizzes: 0, totalQuestions: 0, accuracy: 0, last_review_date: null, streak_days: 0, streak_history: [] };
  return p;
}
async function saveProfile(p) { return dbPut('profile', p); }

/* ============== 4. FSRS-6 scheduler ==============
   Reference: open-spaced-repetition / fsrs.js (FSRS-6 weights).
   Each card stores: stability (S), difficulty (D), retrievability (R),
   reps, lapses, last_review (ISO), next_due (ISO), state (new|learning|review).
   Mastery threshold (per spec): stability >= 90 days AND >=3 consecutive correct.
   Once mastered, status = 'mastered'; next due = +180 days. After another
   correct review at that point, status flips to 'retired' (no more reminders).
*/
const FSRS_WEIGHTS_V6 = [
  // FSRS-6 default weights (open-spaced-repetition reference, 2025)
  0.4072, 1.1829, 3.1262, 15.4722, 7.2102, 0.5316, 1.0651, 0.0234, 1.616,
  0.1544, 1.0824, 1.9813, 0.0953, 0.2975, 2.2042, 0.2407, 2.9466, 0.5034, 0.6567
];
const FSRS_REQUEST_RETENTION = 0.9;
const FSRS_DAY_MS = 86400000;
const MASTERY_STABILITY_DAYS = 90;
const MASTERY_CONSEC_CORRECT = 3;

function fsrsInitFromRating(rating) {
  // rating: 1=Again, 2=Hard, 3=Good, 4=Easy
  const w = FSRS_WEIGHTS_V6;
  const D = clamp(w[4] - Math.exp(w[5] * (rating - 1)) + 1, 1, 10);
  let S;
  if (rating === 1) S = w[0];
  else if (rating === 2) S = w[1];
  else if (rating === 3) S = w[2];
  else S = w[3];
  return { D, S };
}
function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }

function fsrsNextInterval(stability) {
  // I = S * (ln(R) / ln(0.9)) — interval in days needed to drop retrievability to target
  const interval = stability * (Math.log(FSRS_REQUEST_RETENTION) / Math.log(0.9));
  return Math.max(1, Math.round(interval));
}

function fsrsRetrievability(stability, elapsed_days) {
  return Math.pow(1 + elapsed_days / (9 * stability), -1);
}

function fsrsUpdate(card, rating) {
  const w = FSRS_WEIGHTS_V6;
  const now = Date.now();
  const lastTs = card.last_review ? Date.parse(card.last_review) : now;
  const elapsed = Math.max(0, (now - lastTs) / FSRS_DAY_MS);
  let { stability: S, difficulty: D, reps = 0, lapses = 0, consec_correct = 0 } = card;
  let isNew = (S == null || S === 0);

  if (isNew) {
    const init = fsrsInitFromRating(rating);
    S = init.S;
    D = init.D;
    reps = 1;
    if (rating === 1) lapses += 0;
    consec_correct = (rating >= 3) ? 1 : 0;
  } else {
    const R = fsrsRetrievability(S, elapsed);
    // Difficulty update: D' = D - w6 * (rating - 3); pulled toward initial as in FSRS
    const Dnext = clamp(D - w[6] * (rating - 3), 1, 10);
    let Snext;
    if (rating === 1) {
      // Failure stability: PSF formula
      Snext = w[11] * Math.pow(D, -w[12]) * (Math.pow(S + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R));
      Snext = Math.max(0.01, Snext);
      lapses += 1;
      consec_correct = 0;
    } else {
      // Success stability
      const hard = rating === 2 ? w[15] : 1;
      const easy = rating === 4 ? w[16] : 1;
      const sInc = Math.exp(w[8]) * (11 - D) * Math.pow(S, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * hard * easy;
      Snext = S * (1 + sInc);
      consec_correct = (consec_correct || 0) + 1;
    }
    S = Snext;
    D = Dnext;
    reps += 1;
  }

  const interval = fsrsNextInterval(S);
  const next_due = new Date(now + interval * FSRS_DAY_MS).toISOString();

  // Mastery / retire logic per spec
  let status = card.status || 'learning';
  if (status === 'retired' && rating === 1) status = 'reviewing'; // re-introduce if it lapses
  if (status !== 'retired') {
    if (status === 'mastered' && rating >= 3) {
      // mastered card got correct review at the long-tail check → retire
      status = 'retired';
    } else if (S >= MASTERY_STABILITY_DAYS && (consec_correct >= MASTERY_CONSEC_CORRECT) && status !== 'mastered' && status !== 'retired') {
      status = 'mastered';
    } else if (rating === 1 && status === 'mastered') {
      status = 'reviewing';
    } else if (status === 'new' || !status) {
      status = 'learning';
    } else if (reps >= 2 && rating >= 3 && status === 'learning') {
      status = 'reviewing';
    }
  }

  // Mastered cards get an extended next-due (long-tail retention) per spec
  let final_next_due = next_due;
  if (status === 'mastered') {
    final_next_due = new Date(now + 180 * FSRS_DAY_MS).toISOString();
  }
  if (status === 'retired') {
    // retired cards don't generate reminders; push next_due far out
    final_next_due = new Date(now + 365 * FSRS_DAY_MS).toISOString();
  }

  return {
    ...card,
    stability: S,
    difficulty: D,
    reps,
    lapses,
    consec_correct,
    last_review: new Date(now).toISOString(),
    next_due: final_next_due,
    interval_days: interval,
    last_rating: rating,
    status,
  };
}

function cardPhase(card) {
  // 8 visual states. New → ring; mastered → full filled; intermediate by stability bucket.
  const S = card.stability || 0;
  if (!card.last_review) return 0;        // ring
  if (S < 1) return 1;                    // 1/8
  if (S < 3) return 2;                    // 1/4
  if (S < 7) return 3;                    // 3/8
  if (S < 14) return 4;                   // 1/2
  if (S < 30) return 5;                   // 5/8
  if (S < 60) return 6;                   // 3/4
  if (S < MASTERY_STABILITY_DAYS) return 7; // approaching full
  return 8;                                // full
}

/* SVG phase glyph */
function phaseSVG(level, big) {
  // level 0..8. 0=ring, 8=full filled circle, in between half-moons.
  const r = 6;
  const cls = big ? 'phase phase-lg' : 'phase';
  // Build a clip via two arcs based on level/8 fraction
  const frac = level / 8;
  let path = '';
  if (level <= 0) {
    // ring only
    return '<svg class="' + cls + '" viewBox="-8 -8 16 16"><circle class="bg" cx="0" cy="0" r="' + r + '"/></svg>';
  }
  if (level >= 8) {
    return '<svg class="' + cls + '" viewBox="-8 -8 16 16"><circle class="bg" cx="0" cy="0" r="' + r + '"/><circle class="fill" cx="0" cy="0" r="' + r + '"/></svg>';
  }
  // For half-moon look: fill a portion of the circle on the right side
  // Approximate by drawing a shape that fills (level/8) of the circle horizontally
  const w = 2 * r;
  const fillW = w * frac;
  // Use a clipped rect approach
  return '<svg class="' + cls + '" viewBox="-8 -8 16 16">'
    + '<defs><clipPath id="pcl' + level + '"><rect x="' + (-r) + '" y="' + (-r) + '" width="' + fillW + '" height="' + w + '"/></clipPath></defs>'
    + '<circle class="bg" cx="0" cy="0" r="' + r + '"/>'
    + '<circle class="fill" cx="0" cy="0" r="' + r + '" clip-path="url(#pcl' + level + ')"/>'
    + '</svg>';
}

/* ============== 5. State + routing ============== */
const S = {
  view: 'dashboard',          // dashboard | picker | capture-* | quiz | results | cards | review | history | settings
  captureKind: null,          // youtube | podcast | book | flashcards
  currentSource: null,        // {source_id, type, title, ...}
  currentQuiz: null,          // {id, source_id, source_title, questions:[]}
  answers: {},                // index -> selected label
  results: null,              // results object after submit
  currentReview: null,        // {cards:[], i:0, revealed:false, sessionId, savedCount}
  cards: [],
  sources: [],
  quizzes: [],
  profile: null,
  dueCount: 0,
  serverOk: false,
  proxyUrl: '',
  modelInfo: null,
  processing: false,
  hints: {},
  bookCapture: null,          // {pages: [{dataUrl, ts}], chapterTitle, stream}
  toast: null,
  saveToFlashcards: true,     // default opt-in toggle state (per Mike's accepted default)
  promotedQuestionIdx: {},    // for results screen, quiz qIdx -> true
  questionCount: 15,          // selected quiz length (5-100); persisted in localStorage
  lastProcessingSeconds: null,// elapsed s reported by the analyze endpoint, surfaced on the quiz screen
};

// Persist the user's preferred count so it survives reloads / fresh sessions.
try {
  const saved = parseInt(localStorage.getItem('le_question_count') || '', 10);
  if (!isNaN(saved) && saved >= 5 && saved <= 100) S.questionCount = saved;
} catch (e) { /* localStorage may be blocked in private mode — fall back to default */ }

const QUESTION_COUNT_PRESETS = [
  { v: 15, label: 'Quick' },
  { v: 30, label: 'Standard' },
  { v: 50, label: 'Deep' },
  { v: 100, label: 'Mastery' },
];

function setQuestionCount(n) {
  const clamped = Math.max(5, Math.min(100, parseInt(n, 10) || 15));
  S.questionCount = clamped;
  try { localStorage.setItem('le_question_count', String(clamped)); } catch (e) {}
  render();
}

function setCustomCount(input) {
  const raw = parseInt(input.value, 10);
  if (isNaN(raw)) return; // wait for a valid value
  const clamped = Math.max(5, Math.min(100, raw));
  S.questionCount = clamped;
  try { localStorage.setItem('le_question_count', String(clamped)); } catch (e) {}
  // Don't re-render here or the input loses focus mid-typing; just update state.
  // The pill highlight refreshes on the next natural render (e.g., submit).
}

function renderCountSelector(opts) {
  opts = opts || {};
  const compact = !!opts.compact;
  const cur = S.questionCount;
  const isCustom = !QUESTION_COUNT_PRESETS.some(p => p.v === cur);
  const wrapClass = compact ? 'qc-selector qc-selector-compact' : 'qc-selector';
  const pills = QUESTION_COUNT_PRESETS.map(p => {
    const on = (cur === p.v) ? 'on' : '';
    return `<button type="button" class="qc-pill ${on}" onclick="setQuestionCount(${p.v})">
              <span class="qc-pill-label">${p.label}</span>
              <span class="qc-pill-num">${p.v}</span>
            </button>`;
  }).join('');
  return `
    <div class="${wrapClass}">
      <div class="qc-label">Questions</div>
      <div class="qc-pills">
        ${pills}
        <label class="qc-custom ${isCustom ? 'on' : ''}">
          <span class="qc-pill-label">Custom</span>
          <input type="number" min="5" max="100" inputmode="numeric"
                 placeholder="—"
                 value="${isCustom ? cur : ''}"
                 oninput="setCustomCount(this)" />
        </label>
      </div>
      ${compact ? '' : `
        <div class="qc-hint">
          Higher counts cover more concepts but take longer (Deep ≈ 60s, Mastery ≈ 2 min).
        </div>
        <div class="qc-cost">
          More questions = slightly more API cost. Deep / Mastery still cost less than $0.01 per video.
        </div>
      `}
    </div>
  `;
}

function go(view, opts = {}) {
  S.view = view;
  Object.assign(S, opts);
  render();
  window.scrollTo(0, 0);
}
function goTab(tab) {
  if (tab === 'picker') go('picker');
  else if (tab === 'cards') go('cards');
  else go(tab);
}

function render() {
  const root = document.getElementById('app');
  let html = '';
  switch (S.view) {
    case 'dashboard': html = renderDashboard(); break;
    case 'picker':    html = renderPicker(); break;
    case 'capture-youtube': html = renderCaptureUrl('youtube'); break;
    case 'capture-podcast': html = renderCaptureUrl('podcast'); break;
    case 'capture-book':    html = renderCaptureBook(); break;
    case 'quiz':      html = renderQuiz(); break;
    case 'results':   html = renderResults(); break;
    case 'cards':     html = renderCardsHome(); break;
    case 'review':    html = renderReview(); break;
    case 'history':   html = renderHistory(); break;
    case 'settings':  html = renderSettings(); break;
    case 'bookcam':   html = renderBookCam(); break;
    default: html = renderDashboard();
  }
  root.innerHTML = html;
  // tab bar active state
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const map = {
    dashboard: 'dashboard', history: 'history', settings: 'settings',
    cards: 'cards', review: 'cards', picker: null,
  };
  const active = map[S.view];
  if (active) {
    const el = document.querySelector('.tab[data-tab="' + active + '"]');
    if (el) el.classList.add('active');
  }
  // hide tab bar in immersive views
  const tb = document.getElementById('tabbar');
  if (tb) tb.style.display = (S.view === 'review' || S.view === 'bookcam') ? 'none' : '';
  // Re-attach the live MediaStream to the freshly-rendered <video>. Each render()
  // wipes #app's innerHTML, which destroys the previous <video> element and any
  // bound srcObject. Without this hook, the screen goes black after the first
  // snap because the new <video> has no stream attached.
  if (S.view === 'bookcam' && S.bookCapture?.stream) {
    const v = document.getElementById('camVideo');
    if (v && v.srcObject !== S.bookCapture.stream) {
      v.srcObject = S.bookCapture.stream;
      v.play().catch(()=>{});
    }
  }
}
